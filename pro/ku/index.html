<script>
/* ============ 禁止缩放 ============ */
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  const clickable = e.target.closest('a') || e.target.closest('button') || e.target.closest('input');
  if (now - lastTouchEnd <= 300 && !clickable) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('touchstart', e => { if(e.touches.length > 1) e.preventDefault(); }, { passive: false });

/* ============ 配置 ============ */
const CONFIG = { trackEndpoint: '', disclaimerVersion: '1.0', PAGE_SIZE: 20, NEW_DAYS: 7 };
let DB = { version: '', updateTime: '', updateLog: '', apps: [] };
let currentCategory = '全部';
let currentKeyword = '';
let currentPage = 1;
let currentFilteredList = [];
let currentVersionApp = null;
let currentVersionTab = 'android';
let currentSort = 'default';

/* ============ 工具 ============ */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getOS(){ const ua = navigator.userAgent; if(/android/i.test(ua)) return 'Android'; if(/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'iOS'; return 'PC'; }
function isInAppBrowser(){ const ua = navigator.userAgent; return /MicroMessenger/i.test(ua) || (/QQ\/[\d.]+/i.test(ua) && !/MQQBrowser/i.test(ua)) || /Weibo/i.test(ua); }
async function copyText(text){ try{ if(navigator.clipboard && window.isSecureContext) return await navigator.clipboard.writeText(text); }catch(e){} const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
let toastTimer = null;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function isPinned(app){ return app.pinnedUntil && app.pinnedUntil > Date.now(); }
function isNewApp(app){ if(!app.addedAt) return false; return (Date.now() - new Date(app.addedAt).getTime()) <= CONFIG.NEW_DAYS * 86400000; }

/* 判断应用是否有某端版本（含历史版本） */
function hasAndroidVersion(app){
  if(app.androidLinks && app.androidLinks.length > 0) return true;
  return (app.historyVersions || []).some(v => v.androidLinks && v.androidLinks.length > 0);
}
function hasIosVersion(app){
  if(app.iosUrl) return true;
  return (app.historyVersions || []).some(v => v.iosUrl);
}

/* ============ 用户唯一标识 ============ */
function getUserId(){
  let uid = localStorage.getItem('wl_uid');
  if(!uid){
    uid = 'u' + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6);
    localStorage.setItem('wl_uid', uid);
  }
  return uid;
}
function checkRef(){
  try{
    const params = new URLSearchParams(location.search);
    const ref = params.get('ref');
    if(ref && ref !== getUserId()){
      const existing = localStorage.getItem('wl_ref');
      if(!existing || existing !== ref){
        localStorage.setItem('wl_ref', ref);
      }
    }
  }catch(e){}
}

/* ============ 分享本站 ============ */
async function shareSite(){
  const uid = getUserId();
  const baseUrl = location.origin + location.pathname;
  const url = baseUrl + '?ref=' + uid;
  const title = 'WL软件库 - 精选优质应用下载平台';
  const text = '发现一个超好用的软件库，快来看看！';
  if(navigator.share){
    try{ await navigator.share({ title, text, url }); return; }catch(e){ if(e.name === 'AbortError') return; }
  }
  await copyText(url);
  toast('专属分享链接已复制，快发给朋友吧');
}

/* ============ 搜索历史 ============ */
function getSearchHistory(){ try{ return JSON.parse(localStorage.getItem('wl_search_history') || '[]'); }catch(e){ return []; } }
function addSearchHistory(kw){
  if(!kw.trim()) return;
  let h = getSearchHistory();
  h = h.filter(x => x !== kw);
  h.unshift(kw);
  h = h.slice(0, 8);
  localStorage.setItem('wl_search_history', JSON.stringify(h));
}
function clearSearchHistory(){ localStorage.removeItem('wl_search_history'); renderSearchHistory(); }
function renderSearchHistory(){
  const h = getSearchHistory();
  const el = document.getElementById('searchHistory');
  if(!h.length){ el.classList.remove('show'); el.innerHTML=''; return; }
  el.innerHTML = `<div class="sh-title"><span>搜索历史</span><button onclick="clearSearchHistory()">清空</button></div>` +
    h.map(k => `<div class="sh-item" onclick="quickSearch('${esc(k).replace(/'/g,"\\'")}')">🔍 ${esc(k)}</div>`).join('');
}
function quickSearch(kw){
  document.getElementById('searchInput').value = kw;
  document.getElementById('searchHistory').classList.remove('show');
  doSearch();
}

/* ============ 主题 ============ */
function applyTheme(){
  const theme = localStorage.getItem('wl_theme') || 'auto';
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️' : theme === 'light' ? '🌙' : '🌗';
}
function cycleTheme(){
  const cur = localStorage.getItem('wl_theme') || 'auto';
  const next = cur === 'auto' ? 'light' : cur === 'light' ? 'dark' : 'auto';
  localStorage.setItem('wl_theme', next);
  applyTheme();
  toast(next === 'auto' ? '跟随系统' : next === 'light' ? '浅色模式' : '深色模式');
}
applyTheme();

/* ============ 详情页跳转 ============ */
function goDetail(id){
  location.href = './app/' + id + '.html';
}

/* ============ 数据加载 ============ */
async function init(){
  checkRef();
  if(isInAppBrowser()) document.getElementById('wxMask').classList.add('show');
  if(localStorage.getItem('disclaimer_v') !== CONFIG.disclaimerVersion) document.getElementById('disclaimerModal').classList.add('show');
  await loadData();
  if(getOS() === 'PC'){
    document.getElementById('pcBanner').classList.add('show');
    if(window.QRCode) new QRCode(document.getElementById('pcQr'), { text: location.href, width: 110, height: 110, colorDark: '#333', colorLight: '#fff' });
  }
  window.addEventListener('scroll', () => {
    const bt = document.getElementById('backTop');
    if(window.scrollY > 400) bt.classList.add('show'); else bt.classList.remove('show');
  });
  const si = document.getElementById('searchInput');
  si.addEventListener('focus', () => { renderSearchHistory(); document.getElementById('searchHistory').classList.add('show'); });
  si.addEventListener('keyup', e => { if(e.key === 'Enter') doSearch(); });
  document.addEventListener('click', e => {
    if(!e.target.closest('.search-box')) document.getElementById('searchHistory').classList.remove('show');
  });
}
function acceptDisclaimer(){ localStorage.setItem('disclaimer_v', CONFIG.disclaimerVersion); closeModal('disclaimerModal'); }

async function loadData(){
  const listEl = document.getElementById('appList');
  try{
    const res = await fetch('./data.json?t=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const json = JSON.parse(text);
    DB = {
      version: json.version || '1.0.0',
      updateTime: json.updateTime || '',
      updateLog: json.updateLog || '',
      apps: Array.isArray(json.apps) ? json.apps : []
    };
    renderCategories();
    renderApps();
    const vEl = document.getElementById('footerVersion');
    if(vEl) vEl.textContent = DB.version;
    const tEl = document.getElementById('footerTime');
    if(tEl) tEl.textContent = DB.updateTime;
  }catch(e){
    console.error('数据加载失败', e);
    listEl.innerHTML = '<div class="empty">⚠️ 数据加载失败<br>请检查 data.json 是否存在<br><small style="opacity:.6">' + esc(e.message) + '</small></div>';
  }
}

/* ============ 分类 ============ */
function renderCategories(){
  const cats = ['全部'];
  if(DB.apps.some(a => isNewApp(a))) cats.push('✨ 上新');
  DB.apps.forEach(a => { if(a.category && !cats.includes(a.category)) cats.push(a.category); });
  document.getElementById('catNav').innerHTML = cats.map(c => {
    const active = c === currentCategory ? 'active' : '';
    return `<button class="cat-btn ${active}" onclick="switchCategory('${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</button>`;
  }).join('');
}
function switchCategory(cat){ currentCategory = cat; currentPage = 1; renderCategories(); renderApps(); }
function doSearch(){
  currentKeyword = document.getElementById('searchInput').value.trim();
  if(currentKeyword) addSearchHistory(currentKeyword);
  document.getElementById('searchHistory').classList.remove('show');
  currentPage = 1;
  renderApps();
}
function toggleSort(){
  const modes = ['default', 'newest', 'random'];
  const names = { default: '默认', newest: '最新', random: '随机' };
  const icons = { default: '🔀', newest: '🆕', random: '🎲' };
  currentSort = modes[(modes.indexOf(currentSort) + 1) % modes.length];
  document.getElementById('sortBtn').innerHTML = `${icons[currentSort]} ${names[currentSort]}`;
  currentPage = 1;
  renderApps();
}

/* ============ 列表渲染 ============ */
function renderApps(){
  const listEl = document.getElementById('appList');
  const pagEl = document.getElementById('pagination');
  const os = getOS();
  let list = DB.apps.slice();

  if(currentCategory === '✨ 上新'){
    list = list.filter(a => isNewApp(a));
  } else if(currentCategory !== '全部'){
    list = list.filter(a => a.category === currentCategory);
  }
  if(currentKeyword){
    const kw = currentKeyword.toLowerCase();
    list = list.filter(a => (a.name||'').toLowerCase().includes(kw) || (a.desc||'').toLowerCase().includes(kw));
  }
  list.sort((a,b) => {
    const ap = isPinned(a), bp = isPinned(b);
    if(ap && !bp) return -1;
    if(!ap && bp) return 1;
    if(currentSort === 'newest'){
      const ta = a.addedAt ? new Date(a.addedAt).getTime() : 0;
      const tb = b.addedAt ? new Date(b.addedAt).getTime() : 0;
      return tb - ta;
    }
    return 0;
  });
  if(currentSort === 'random'){
    const p = list.filter(a => isPinned(a));
    const n = list.filter(a => !isPinned(a));
    for(let i = n.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [n[i], n[j]] = [n[j], n[i]]; }
    list = [...p, ...n];
  }

  currentFilteredList = list;
  if(!list.length){
    listEl.innerHTML = `<div class="empty">😶 没有找到相关应用<br>试试搜索其他关键词吧</div>`;
    pagEl.innerHTML = '';
    return;
  }
  const total = list.length;
  const totalPages = Math.ceil(total / CONFIG.PAGE_SIZE);
  if(currentPage > totalPages) currentPage = totalPages;
  if(currentPage < 1) currentPage = 1;
  const start = (currentPage - 1) * CONFIG.PAGE_SIZE;
  const end = Math.min(start + CONFIG.PAGE_SIZE, total);
  const pageList = list.slice(start, end);
  listEl.innerHTML = pageList.map(app => renderCard(app, os)).join('');
  renderPagination(currentPage, totalPages, start, end, total);
}

function renderCard(app, os){
  const versionTag = app.version ? `<span class="version-tag">v${esc(app.version)}</span>` : '';
  const newTag = isNewApp(app) ? `<span class="badge-new">NEW</span>` : '';
  const pinTag = isPinned(app) ? `<span class="badge-pin">📌</span>` : '';
  const actionHtml = renderAction(app);
  const cardClass = isPinned(app) ? 'app-card pinned' : 'app-card';

  return `
    <div class="${cardClass}" data-id="${app.id}" onclick="goDetail(${app.id})">
      <div class="app-info">
        <div class="app-icon">${renderIcon(app)}</div>
        <div class="app-text">
          <h2 class="app-name">${esc(app.name)} ${versionTag} ${pinTag} ${newTag}</h2>
          <div class="app-desc">${esc(app.desc)}</div>
        </div>
      </div>
      <div class="action-area">
        ${actionHtml}
      </div>
    </div>
  `;
}

/* ★ 统一按钮逻辑：只要有任意下载方式就显示"查看" */
function renderAction(app){
  const hasA = hasAndroidVersion(app);
  const hasI = hasIosVersion(app);
  if(!hasA && !hasI) return `<div class="icon-placeholder">📱</div>`;
  return `<button class="btn-download" onclick="event.stopPropagation();showVersionPicker(${app.id})">查看</button>`;
}

function renderIcon(app){
  if(app.iconUrl){
    const fb = (app.icon || '📦').replace(/'/g, "\\'");
    return `<img src="${esc(app.iconUrl)}" alt="${esc(app.name)}" loading="lazy" onerror="this.parentNode.innerHTML='${fb}'">`;
  }
  return esc(app.icon || '📦');
}

function renderPagination(page, totalPages, start, end, total){
  const el = document.getElementById('pagination');
  if(totalPages <= 1){ el.innerHTML = `<div class="page-info">共 ${total} 个应用</div>`; return; }
  let html = '';
  html += `<button class="page-btn" ${page===1?'disabled':''} onclick="gotoPage(1)">首页</button>`;
  html += `<button class="page-btn" ${page===1?'disabled':''} onclick="gotoPage(${page-1})">‹</button>`;
  const nums = [];
  const left = Math.max(1, page - 2), right = Math.min(totalPages, page + 2);
  if(left > 1){ nums.push(1); if(left > 2) nums.push('...'); }
  for(let i = left; i <= right; i++) nums.push(i);
  if(right < totalPages){ if(right < totalPages - 1) nums.push('...'); nums.push(totalPages); }
  nums.forEach(p => {
    if(p === '...') html += `<span class="page-ellipsis">…</span>`;
    else html += `<button class="page-btn ${p===page?'active':''}" onclick="gotoPage(${p})">${p}</button>`;
  });
  html += `<button class="page-btn" ${page===totalPages?'disabled':''} onclick="gotoPage(${page+1})">›</button>`;
  html += `<button class="page-btn" ${page===totalPages?'disabled':''} onclick="gotoPage(${totalPages})">末页</button>`;
  html += `<div class="page-info">第 ${page}/${totalPages} 页 · ${start+1}-${end} 共 ${total} 个</div>`;
  el.innerHTML = html;
}
function gotoPage(p){ if(p === currentPage) return; currentPage = p; renderApps(); window.scrollTo(0,0); }

/* ============ 版本弹窗（含双 Tab） ============ */
function showVersionPicker(appId){
  const app = DB.apps.find(a => a.id === appId); if(!app) return;
  currentVersionApp = app;
  const hasA = hasAndroidVersion(app);
  const hasI = hasIosVersion(app);

  // 智能选择默认 Tab
  const os = getOS();
  if(os === 'iOS' && hasI) currentVersionTab = 'ios';
  else if(os === 'Android' && hasA) currentVersionTab = 'android';
  else if(!hasA && hasI) currentVersionTab = 'ios';
  else currentVersionTab = 'android';

  document.getElementById('versionTitle').innerHTML = `📦 ${esc(app.name)}`;
  renderVersionContent();
  document.getElementById('versionModal').classList.add('show');
}

function switchVersionTab(tab){
  currentVersionTab = tab;
  renderVersionContent();
}

function renderVersionContent(){
  const app = currentVersionApp;
  if(!app) return;
  const hasA = hasAndroidVersion(app);
  const hasI = hasIosVersion(app);
  const tab = currentVersionTab;
  const os = tab === 'android' ? 'Android' : 'iOS';

  // 渲染 Tab 切换栏
  document.getElementById('versionTabs').innerHTML = `
    <button class="version-tab ${tab === 'android' ? 'active' : ''}" onclick="switchVersionTab('android')" ${!hasA ? 'disabled' : ''}>📱 安卓</button>
    <button class="version-tab ${tab === 'ios' ? 'active' : ''}" onclick="switchVersionTab('ios')" ${!hasI ? 'disabled' : ''}>🍎 iOS</button>
  `;

  // 该 Tab 无内容
  if(tab === 'android' && !hasA){
    document.getElementById('versionList').innerHTML = '<div class="version-empty">📱 该应用暂无安卓版本<small>可以点击上方切换到 🍎 iOS 查看</small></div>';
    return;
  }
  if(tab === 'ios' && !hasI){
    document.getElementById('versionList').innerHTML = '<div class="version-empty">🍎 该应用暂无 iOS 版本<small>可以点击上方切换到 📱 安卓 查看</small></div>';
    return;
  }

  // 组装版本列表（当前版本 + 历史版本）
  const versions = [
    { version: app.version, note: app.note || '', androidLinks: app.androidLinks || [], iosUrl: app.iosUrl || '', isTransform: !!app.isTransform, iosType: app.iosType || 'transform', transformTip: app.transformTip || '', isLatest: true },
    ...(app.historyVersions || []).map(v => ({
      version: v.version || '', note: v.note || '', androidLinks: v.androidLinks || [], iosUrl: v.iosUrl || '', isTransform: !!v.isTransform, iosType: v.iosType || 'transform', transformTip: v.transformTip || '', isLatest: false
    }))
  ];

  let html = '';
  html += `<div class="version-group-title">✨ 当前版本</div>`;
  html += renderVersionRow(versions[0], os, 0, true);

  if(versions.length > 1){
    html += `<div class="version-group-title">📜 历史版本</div>`;
    const histories = versions.slice(1);
    const displayCount = 4;
    for(let i = 0; i < Math.min(histories.length, displayCount); i++){
      html += renderVersionRow(histories[i], os, i+1, false);
    }
    if(histories.length > displayCount){
      let hidden = '';
      for(let i = displayCount; i < histories.length; i++) hidden += renderVersionRow(histories[i], os, i+1, false);
      html += `<div id="hiddenHistory" style="display:none">${hidden}</div>`;
      html += `<button class="history-toggle-btn" id="historyToggleBtn" onclick="toggleHistory(${histories.length - displayCount})">展开剩余 ${histories.length - displayCount} 个历史版本 ▼</button>`;
    }
  }

  document.getElementById('versionList').innerHTML = html;
}

/* 渲染单行版本（根据 Tab 显示对应内容） */
function renderVersionRow(v, os, idx, isCurrent){
  let actions = '';
  if(os === 'Android'){
    const links = v.androidLinks || [];
    actions = links.length
      ? links.map((l,i) => `<button class="btn-download sm" onclick="openVersionAndroidLink(${idx},${i})">${esc(l.provider || '下载')}</button>`).join('')
      : '<span class="version-no-link">该版本无安卓链接</span>';
  } else {
    if(!v.iosUrl) actions = '<span class="version-no-link">该版本无 iOS 链接</span>';
    else if(v.isTransform) actions = `<button class="btn-download sm" onclick="openVersionIos(${idx})">${v.iosType === 'clone' ? '分身安装' : '安装教程'}</button>`;
    else actions = `<button class="btn-download sm" onclick="openVersionIos(${idx})">App Store</button>`;
  }
  const badge = isCurrent ? '<span class="badge-latest">最新</span>' : '<span class="badge-old">旧版</span>';
  const noteHtml = v.note ? `<div class="version-note">${esc(v.note)}</div>` : '';
  return `<div class="version-row ${isCurrent?'current':''}">
    <div class="version-info">
      <div class="version-head-line"><span class="version-num">v${esc(v.version || '未知')}</span>${badge}</div>
      ${noteHtml}
    </div>
    <div class="version-actions">${actions}</div>
  </div>`;
}

function toggleHistory(count){
  const h = document.getElementById('hiddenHistory');
  const b = document.getElementById('historyToggleBtn');
  if(h.style.display === 'none'){ h.style.display = 'block'; b.textContent = '收起历史版本 ▲'; }
  else { h.style.display = 'none'; b.textContent = `展开剩余 ${count} 个历史版本 ▼`; }
}

/* ============ 埋点 ============ */
function track(appId, action){
  try{ const k = `track_${appId}_${action}`; localStorage.setItem(k, parseInt(localStorage.getItem(k) || '0') + 1); }catch(e){}
  const app = DB.apps.find(a => a.id === appId);
  const appName = app ? app.name : ('ID:' + appId);
  let os = 'PC';
  if(/android/i.test(navigator.userAgent)) os = 'Android';
  else if(/iPad|iPhone|iPod/.test(navigator.userAgent)) os = 'iOS';
  if(typeof _szc !== 'undefined' && typeof _szc.push === 'function') _szc.push(['_trackEvent', os + '下载', action, appName]);
  if(CONFIG.trackEndpoint){
    fetch(`${CONFIG.trackEndpoint}?id=${encodeURIComponent(appId)}&action=${encodeURIComponent(action)}&app=${encodeURIComponent(appName)}&os=${encodeURIComponent(os)}&uid=${encodeURIComponent(getUserId())}&t=${Date.now()}`, { mode: 'no-cors' }).catch(()=>{});
  }
}

/* ============ 打开链接 ============ */
function openAndroidLink(appId, index){
  const app = DB.apps.find(a => a.id === appId);
  if(!app || !app.androidLinks || !app.androidLinks[index]) return;
  const link = app.androidLinks[index];
  track(appId, 'android_' + (link.provider || index));
  if(link.pwd){
    copyText(link.pwd).then(() => toast(`提取码 ${link.pwd} 已复制`)).catch(()=>{});
    setTimeout(() => window.open(link.url, '_blank', 'noopener'), 350);
  } else window.open(link.url, '_blank', 'noopener');
}
function openIosLink(appId){
  const app = DB.apps.find(a => a.id === appId);
  if(!app || !app.iosUrl) return;
  track(appId, 'ios');
  window.open(app.iosUrl, '_blank', 'noopener');
}
function openVersionAndroidLink(versionIdx, linkIdx){
  const app = currentVersionApp; if(!app) return;
  const v = versionIdx === 0 ? app : (app.historyVersions || [])[versionIdx - 1];
  if(!v || !v.androidLinks || !v.androidLinks[linkIdx]) return;
  const link = v.androidLinks[linkIdx];
  closeModal('versionModal');
  track(app.id, 'android_v' + (v.version || '') + '_' + (link.provider || linkIdx));
  if(link.pwd){
    copyText(link.pwd).then(() => toast(`提取码 ${link.pwd} 已复制`)).catch(()=>{});
    setTimeout(() => window.open(link.url, '_blank', 'noopener'), 350);
  } else window.open(link.url, '_blank', 'noopener');
}
function openVersionIos(versionIdx){
  const app = currentVersionApp; if(!app) return;
  const v = versionIdx === 0 ? app : (app.historyVersions || [])[versionIdx - 1];
  if(!v || !v.iosUrl) return;
  closeModal('versionModal');
  track(app.id, 'ios_v' + (v.version || ''));
  if(v.isTransform && v.transformTip){
    const isClone = v.iosType === 'clone';
    document.getElementById('transformTitle').textContent = isClone ? '🔮 iOS 分身教程' : '🔮 iOS 变身教程';
    document.getElementById('transformTipText').textContent = v.transformTip;
    document.getElementById('transformDownloadBtn').onclick = () => window.open(v.iosUrl, '_blank', 'noopener');
    document.getElementById('transformModal').classList.add('show');
  } else window.open(v.iosUrl, '_blank', 'noopener');
}
function showUpdateLog(){
  document.getElementById('updateLogContent').textContent = DB.updateLog || '暂无更新日志';
  document.getElementById('updateModal').classList.add('show');
}

document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if(e.target === m) m.classList.remove('show'); }));
document.addEventListener('keydown', e => { if(e.key === 'Escape') document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show')); });
window.addEventListener('load', init);
