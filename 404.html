<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面走丢了</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --mx: 0;
    --my: 0;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    background: #05050b;
    color: #e9e9f5;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- 背景层 ---------- */
  .bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(124, 92, 255, .18), transparent 70%),
      radial-gradient(ellipse 60% 45% at 50% 100%, rgba(0, 229, 255, .10), transparent 70%);
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle 3s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: calc(var(--o, 1) * .18); transform: scale(.8); }
    50%      { opacity: var(--o, 1);            transform: scale(1.15); }
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    will-change: transform;
  }
  .orb.a {
    width: 460px; height: 460px;
    background: #6d4dff; opacity: .28;
    top: -160px; left: -140px;
    animation: drift1 16s ease-in-out infinite;
  }
  .orb.b {
    width: 400px; height: 400px;
    background: #00c2ff; opacity: .20;
    bottom: -170px; right: -110px;
    animation: drift2 21s ease-in-out infinite;
  }
  .orb.c {
    width: 280px; height: 280px;
    background: #ff3d9a; opacity: .14;
    top: 48%; left: 62%;
    animation: drift3 26s ease-in-out infinite;
  }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(70px, 50px) scale(1.15); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1.1); }
    50%      { transform: translate(-60px, -40px) scale(.92); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(-80px, 60px) scale(1.2); }
    66%      { transform: translate(50px, -70px) scale(.95); }
  }

  /* ---------- 视差层 ---------- */
  .stage {
    position: relative;
    z-index: 1;
    transform: translate3d(calc(var(--mx) * 18px), calc(var(--my) * 18px), 0);
    transition: transform .45s cubic-bezier(.2, .8, .2, 1);
    will-change: transform;
  }

  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .content > * {
    opacity: 0;
    animation: rise .95s cubic-bezier(.2, .8, .2, 1) forwards;
  }
  .content > *:nth-child(1) { animation-delay: .05s; }
  .content > *:nth-child(2) { animation-delay: .16s; }
  .content > *:nth-child(3) { animation-delay: .28s; }
  .content > *:nth-child(4) { animation-delay: .38s; }
  .content > *:nth-child(5) { animation-delay: .48s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- 状态标签 ---------- */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 15px;
    margin-bottom: 28px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .1);
    background: rgba(255, 255, 255, .04);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .18em;
    color: rgba(233, 233, 245, .58);
    white-space: nowrap;
  }

  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ff4d6d;
    box-shadow: 0 0 10px #ff4d6d;
    animation: pulse 1.9s ease-in-out infinite;
  }

  @keyframes pulse {
    50% { opacity: .3; transform: scale(.8); }
  }

  /* ---------- 404 大字 ---------- */
  .code-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 6px;
  }

  .orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 122%;
    height: 148%;
    transform: translate(-50%, -50%);
    overflow: visible;
    pointer-events: none;
    filter: drop-shadow(0 0 6px rgba(34, 211, 238, .45));
  }

  .orbit ellipse {
    animation: dash 7s linear infinite;
  }

  @keyframes dash {
    to { stroke-dashoffset: -64; }
  }

  .code {
    position: relative;
    margin: 0;
    font-size: clamp(86px, 20vw, 200px);
    line-height: 1;
    font-weight: 800;
    letter-spacing: -.02em;
    filter: drop-shadow(0 12px 55px rgba(124, 92, 255, .45));
  }

  .code span {
    display: inline-block;
    background: linear-gradient(180deg,
      #ffffff 0%,
      #d9d3ff 28%,
      #8b7bff 60%,
      #35c9ff 100%);
    background-size: 100% 220%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: bob 4.5s ease-in-out infinite,
               sheen 8s ease-in-out infinite;
  }

  .code span:nth-child(1) { animation-delay: -.2s, -.5s; }
  .code span:nth-child(2) { animation-delay: -1.1s, -1.8s; }
  .code span:nth-child(3) { animation-delay: -2s, -3s; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-11px); }
  }

  @keyframes sheen {
    0%, 100% { background-position: 0% 0%; }
    50%      { background-position: 0% 100%; }
  }

  /* ---------- 文案 ---------- */
  .title {
    margin: 22px 0 14px;
    font-size: clamp(20px, 3.4vw, 27px);
    font-weight: 650;
    letter-spacing: .01em;
    color: #f4f4ff;
  }

  .desc {
    margin: 0 0 38px;
    max-width: 30em;
    font-size: 15px;
    line-height: 1.75;
    color: rgba(233, 233, 245, .52);
  }

  /* ---------- 按钮 ---------- */
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
  }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 32px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    overflow: hidden;
    transition: transform .28s cubic-bezier(.2, .8, .3, 1.3),
                box-shadow .35s ease,
                background .35s ease,
                border-color .35s ease;
  }

  .btn:focus-visible {
    outline: 2px solid #8b7bff;
    outline-offset: 3px;
  }

  .btn.primary {
    color: #0a0a14;
    background: linear-gradient(135deg, #b9a5ff 0%, #7c5cff 45%, #22d3ee 100%);
    background-size: 180% 180%;
    background-position: 0% 50%;
    box-shadow: 0 12px 34px -12px rgba(124, 92, 255, .95);
    transition: transform .28s cubic-bezier(.2, .8, .3, 1.3),
                box-shadow .35s ease,
                background-position .6s ease;
  }

  .btn.primary:hover {
    transform: translateY(-3px);
    background-position: 100% 50%;
    box-shadow: 0 20px 46px -14px rgba(124, 92, 255, 1);
  }

  .btn.primary:active { transform: translateY(-1px) scale(.985); }

  .btn.ghost {
    color: #cdcde4;
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .12);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }

  .btn.ghost:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, .1);
    border-color: rgba(255, 255, 255, .22);
  }

  .btn.ghost:active { transform: translateY(-1px) scale(.985); }

  /* ---------- 响应式 / 无障碍 ---------- */
  @media (max-width: 480px) {
    .badge { letter-spacing: .14em; font-size: 10px; }
    .desc { margin-bottom: 30px; }
    .btn { padding: 13px 26px; font-size: 14px; }
    .orbit { width: 130%; height: 160%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

  <!-- 背景 -->
  <div class="bg" aria-hidden="true">
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
  </div>

  <!-- 内容 -->
  <main class="stage">
    <div class="content">

      <div class="badge">
        <span class="dot"></span>
        ERROR 404 · NOT FOUND
      </div>

      <div class="code-wrap">
        <svg class="orbit" viewBox="0 0 600 300" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="orbitGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"   stop-color="#7c5cff" stop-opacity="0"/>
              <stop offset="45%"  stop-color="#22d3ee" stop-opacity=".85"/>
              <stop offset="100%" stop-color="#ff4d9d" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <ellipse cx="300" cy="150" rx="290" ry="118"
                   fill="none" stroke="url(#orbitGrad)"
                   stroke-width="1.6" stroke-dasharray="6 10"/>
        </svg>

        <h1 class="code" aria-label="404">
          <span>4</span><span>0</span><span>4</span>
        </h1>
      </div>

      <h2 class="title">页面走丢了</h2>

      <p class="desc">
        你要找的页面可能已被移动、删除，或者它从未存在过。<br>
        检查一下网址，或者回到安全地带吧。
      </p>

      <div class="actions">
        <a class="btn primary" href="/">返回首页</a>
        <button class="btn ghost" type="button" onclick="history.back()">回到上一页</button>
      </div>

    </div>
  </main>

<script>
  /* ---------- 生成星空 ---------- */
  (function () {
    const bg = document.querySelector('.bg');
    const frag = document.createDocumentFragment();

    for (let i = 0; i < 130; i++) {
      const s = document.createElement('i');
      s.className = 'star';
      const size = (Math.random() * 1.8 + 1).toFixed(1);
      s.style.cssText =
        'left:' + (Math.random() * 100).toFixed(2) + '%;' +
        'top:' + (Math.random() * 100).toFixed(2) + '%;' +
        'width:' + size + 'px;' +
        'height:' + size + 'px;' +
        'animation-delay:' + (-Math.random() * 5).toFixed(2) + 's;' +
        'animation-duration:' + (2.5 + Math.random() * 3).toFixed(2) + 's;' +
        '--o:' + (0.3 + Math.random() * 0.7).toFixed(2) + ';';
      frag.appendChild(s);
    }

    bg.appendChild(frag);
  })();

  /* ---------- 鼠标视差 ---------- */
  (function () {
    const root = document.documentElement;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;

    let ticking = false;

    window.addEventListener('mousemove', function (e) {
      if (ticking) return;
      ticking = true;

      requestAnimationFrame(function () {
        const x = e.clientX / window.innerWidth - 0.5;
        const y = e.clientY / window.innerHeight - 0.5;
        root.style.setProperty('--mx', x.toFixed(3));
        root.style.setProperty('--my', y.toFixed(3));
        ticking = false;
      });
    }, { passive: true });
  })();
</script>

</body>
</html>
