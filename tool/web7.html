<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Webtor 云播放 (全量解析版)</title>
    <style>
        :root {
            --bg: #0b0e14; --surface: #161b22; --border: #30363d;
            --text: #e6edf3; --muted: #8b949e; --accent: #238636; --accent-hover: #2ea043;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px 16px;
        }
        .container { width: 100%; max-width: 800px; }
        h2 { font-size: 1.25rem; margin-bottom: 6px; }
        p.subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.4; }

        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 14px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); font-size: 16px; outline: none;
        }
        .input-group input:focus { border-color: var(--accent); }
        .input-group button {
            width: 100%; padding: 14px; border-radius: 8px; border: none;
            background: var(--accent); color: white; font-weight: 600;
            font-size: 16px; cursor: pointer; transition: background 0.2s;
        }
        .input-group button:active { background: var(--accent-hover); }
        .input-group button:disabled { opacity: 0.7; cursor: not-allowed; }

        @media (min-width: 600px) {
            .input-group { flex-direction: row; }
            .input-group input { flex: 1; }
            .input-group button { width: auto; padding: 14px 28px; }
        }

        #file-list-container { display: none; margin-bottom: 20px; animation: fadeIn 0.3s; }
        #file-list-container label { display: block; color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; }
        #file-select {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid var(--accent); background: var(--surface);
            color: var(--text); font-size: 15px; outline: none;
        }

        #webtor-player {
            width: 100%; aspect-ratio: 16 / 9; background: #000;
            border-radius: 10px; overflow: hidden; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); position: relative;
        }
        #webtor-player iframe, #webtor-player video {
            width: 100% !important; height: 100% !important;
            border: none; position: absolute; top: 0; left: 0;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h2>☁️ Webtor 云播放 (全量解析版)</h2>
        <p class="subtitle">突破官方分页限制，深度抓取全部文件并支持精准切换。</p>
        
        <div class="input-group">
            <input type="text" id="magnetInput" placeholder="粘贴 magnet:?xt=urn:btih:..." />
            <button onclick="playMagnet()" id="playBtn">开始播放</button>
        </div>

        <div id="file-list-container">
            <label id="file-list-label">📂 已解析到全部文件，请选择：</label>
            <select id="file-select"></select>
        </div>

        <div id="webtor-player">
            <span style="color:#8b949e; font-size:14px;">等待输入磁力链接...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@webtor/embed-sdk-js/dist/index.min.js" charset="utf-8" async></script>

    <script>
        const TRACKERS = [
            '&tr=udp%3A%2F%2Fexplodie.org%3A6969',
            '&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337',
            '&tr=wss%3A%2F%2Ftracker.openwebtorrent.com'
        ].join('');

        // 提取 Infohash
        function getInfohash(magnet) {
            const match = magnet.match(/urn:btih:([a-fA-F0-9]{40})/);
            return match ? match[1].toLowerCase() : null;
        }

        // 从单页 HTML 中提取文件信息
        function parseFilesFromHtml(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const links = doc.querySelectorAll('a[data-async-target="#content"]');
            const files = [];
            
            links.forEach(link => {
                const href = link.getAttribute('href');
                if (!href) return;
                
                const urlParams = new URLSearchParams(href.split('?')[1]);
                const filePath = urlParams.get('file'); 
                
                const spans = link.querySelectorAll('span');
                let name = '', size = '';
                spans.forEach(span => {
                    const text = span.innerText.trim();
                    if (text.match(/\.(mp4|mkv|avi|webm|mov|flv|wmv)$/i)) name = text;
                    if (text.match(/(MB|GB|TB)$/i)) size = text;
                });

                if (filePath && name) {
                    files.push({ path: filePath, name: name, size: size });
                }
            });
            return files;
        }

        // 核心逻辑：串行、带重试机制抓取所有分页
        async function fetchAllPagesSerial(infohash, onProgress) {
            const proxy = 'https://api.allorigins.win/raw?url=';
            let allFiles = [];
            let currentPage = 1;
            let maxPage = 1;
            let pwd = '';

            // 加入时间戳防止代理缓存旧页面
            const getProxyUrl = (url) => proxy + encodeURIComponent(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now());

            while (currentPage <= maxPage) {
                onProgress(`正在解析第 ${currentPage}/${maxPage} 页...`);
                
                let pageUrl = `https://webtor.io/${infohash}`;
                if (currentPage > 1) {
                    pageUrl = `https://webtor.io/${infohash}?pwd=${encodeURIComponent(pwd)}&page=${currentPage}`;
                }

                let success = false;
                let retries = 3; // 失败重试 3 次

                while (retries > 0 && !success) {
                    try {
                        const res = await fetch(getProxyUrl(pageUrl));
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const htmlText = await res.text();
                        
                        // 检查是否抓到了真正的页面
                        if (htmlText.includes('Just a moment...') || htmlText.includes('Attention Required!')) {
                            throw new Error('被 Cloudflare 拦截');
                        }

                        // 解析当前页
                        const pageFiles = parseFilesFromHtml(htmlText);
                        allFiles = allFiles.concat(pageFiles);

                        // 如果是第一页，提取分页信息
                        if (currentPage === 1) {
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(htmlText, 'text/html');
                            const pageLinks = doc.querySelectorAll('a[data-async-target="#list"]');
                            
                            pageLinks.forEach(link => {
                                const href = link.getAttribute('href');
                                if (href && href.includes('page=')) {
                                    const urlParams = new URLSearchParams(href.split('?')[1]);
                                    if (!pwd) pwd = urlParams.get('pwd');
                                    const p = parseInt(urlParams.get('page'));
                                    if (p > maxPage) maxPage = p;
                                }
                            });
                        }
                        
                        success = true;
                    } catch (e) {
                        retries--;
                        console.warn(`第 ${currentPage} 页请求失败 (${e.message})，重试... (剩余 ${retries})`);
                        await new Promise(r => setTimeout(r, 1500)); // 失败延时 1.5 秒重试
                    }
                }

                if (!success) {
                    console.error(`第 ${currentPage} 页彻底失败，停止抓取`);
                    break; // 如果重试全失败，放弃后续抓取
                }

                currentPage++;
                // 每一页请求成功后的间隔延时，防止代理封 IP
                if (currentPage <= maxPage) {
                    await new Promise(r => setTimeout(r, 800)); 
                }
            }

            // 去重 & 自然排序
            const uniqueFiles = [];
            const seen = new Set();
            for (let f of allFiles) {
                if (!seen.has(f.path)) {
                    seen.add(f.path);
                    uniqueFiles.push(f);
                }
            }
            uniqueFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));
            
            return uniqueFiles;
        }

        async function playMagnet() {
            const input = document.getElementById('magnetInput').value.trim();
            const container = document.getElementById('webtor-player');
            const playBtn = document.getElementById('playBtn');
            const listContainer = document.getElementById('file-list-container');
            const listLabel = document.getElementById('file-list-label');
            const fileSelect = document.getElementById('file-select');

            if (!input.startsWith('magnet:?')) {
                alert('请输入有效的磁力链接');
                return;
            }

            const infohash = getInfohash(input);
            if (!infohash) {
                alert('无法识别磁力链接中的 Hash');
                return;
            }

            playBtn.disabled = true;
            playBtn.innerText = '解析中...';
            container.innerHTML = '<span style="color:#8b949e; font-size:14px;">正在努力获取文件列表，请稍候...</span>';
            listContainer.style.display = 'none';

            let finalMagnet = input;
            if (!input.includes('tr=')) finalMagnet = input + TRACKERS;

            try {
                const files = await fetchAllPagesSerial(infohash, (msg) => {
                    playBtn.innerText = msg; // 动态更新按钮文字
                });
                
                if (files && files.length > 0) {
                    fileSelect.innerHTML = '';
                    files.forEach((file) => {
                        const option = document.createElement('option');
                        option.value = file.path;
                        option.textContent = `[${file.size}] ${file.name}`;
                        fileSelect.appendChild(option);
                    });

                    listLabel.innerText = `📂 已解析到全部 ${files.length} 个文件，请选择：`;
                    listContainer.style.display = 'block';
                    
                    fileSelect.onchange = (e) => {
                        renderPlayer(finalMagnet, e.target.value);
                    };

                    // 默认播放第一个
                    renderPlayer(finalMagnet, files[0].path);
                } else {
                    throw new Error('未找到视频文件');
                }
            } catch (e) {
                console.warn("列表解析失败，触发兜底模式:", e);
                container.innerHTML = '<span style="color:#ff7b72; font-size:14px;">列表获取超时，尝试直接播放...</span>';
                renderPlayer(finalMagnet, null);
            }

            playBtn.innerText = '开始播放';
            playBtn.disabled = false;
        }

        function renderPlayer(magnet, filePath) {
            const container = document.getElementById('webtor-player');
            container.innerHTML = ''; 

            const render = () => {
                const config = {
                    id: 'webtor-player',
                    magnet: magnet,
                    width: '100%',
                    height: '100%'
                };
                if (filePath) {
                    config.path = filePath; 
                }
                window.webtor.push(config);
            };

            if (window.webtor) {
                render();
            } else {
                let attempts = 0;
                const checkSdk = setInterval(() => {
                    if (window.webtor) {
                        clearInterval(checkSdk);
                        render();
                    }
                    if (++attempts > 50) {
                        clearInterval(checkSdk);
                        container.innerHTML = '<span style="color:#ff7b72;">SDK 加载失败，请刷新</span>';
                    }
                }, 100);
            }
        }
    </script>
</body>
</html>
