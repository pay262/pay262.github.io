<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Webtor 云播放 (纯净直连版)</title>
    <style>
        :root {
            --bg: #0b0e14; --surface: #161b22; --border: #30363d;
            --text: #e6edf3; --muted: #8b949e; --accent: #238636; --accent-hover: #2ea043;
            --pink: #f13e7a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px 16px;
        }
        .container { width: 100%; max-width: 800px; }
        h2 { font-size: 1.25rem; margin-bottom: 6px; display: flex; align-items: center; gap: 8px;}
        p.subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.4; }

        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 14px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); font-size: 15px; outline: none; transition: 0.2s;
        }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(35, 134, 54, 0.2); }
        .input-group button {
            width: 100%; padding: 14px; border-radius: 8px; border: none;
            background: var(--accent); color: white; font-weight: 600;
            font-size: 16px; cursor: pointer; transition: background 0.2s;
        }
        .input-group button:active { background: var(--accent-hover); }
        .input-group button:disabled { opacity: 0.7; cursor: not-allowed; }

        @media (min-width: 600px) {
            .input-group { flex-direction: row; }
            .input-group input { flex: 1; }
            .input-group button { width: auto; padding: 14px 28px; }
        }

        .action-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .action-btn {
            flex: 1; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 14px;
            border: 1px solid var(--border); background: var(--surface); color: var(--text);
            text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 5px;
            transition: 0.2s; cursor: pointer;
        }
        .action-btn:hover { background: rgba(255,255,255,0.1); }
        .action-btn.primary { background: rgba(241, 62, 122, 0.1); border-color: rgba(241, 62, 122, 0.3); color: var(--pink); }
        
        #webtor-player {
            width: 100%; aspect-ratio: 16 / 9; background: #000;
            border-radius: 10px; overflow: hidden; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #webtor-player iframe, #webtor-player video {
            width: 100% !important; height: 100% !important;
            border: none; position: absolute; top: 0; left: 0;
        }
        
        .tips {
            margin-top: 15px; font-size: 0.85rem; color: var(--muted); text-align: center; line-height: 1.6;
            background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px;
        }
        .tips strong { color: var(--text); }
    </style>
</head>
<body>
    <div class="container">
        <h2>☁️ Webtor 云播放</h2>
        <p class="subtitle">纯净直连，无需代理。</p>
        
        <div class="input-group">
            <input type="text" id="magnetInput" placeholder="粘贴 magnet:?xt=urn:btih:..." />
            <button onclick="playMagnet()" id="playBtn">开始播放</button>
        </div>

        <div class="action-bar" id="actionBar" style="display: none;">
            <a href="#" id="officialLink" target="_blank" class="action-btn primary">
                🌐 去官方网页看完整列表
            </a>
        </div>

        <div id="webtor-player">
            <span style="color:#8b949e; font-size:14px;">等待输入磁力链接...</span>
        </div>

        <div class="tips">
            💡 <strong>为什么没有本地列表？</strong><br>
            受限于网络和官方跨域限制，在线获取完整列表极易失败。<br>
            建议：先在电脑或官方页面查看完整列表，或者直接下载种子到本地。
        </div>
    </div>

    <!-- 引入官方 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@webtor/embed-sdk-js/dist/index.min.js" charset="utf-8" async></script>

    <script>
        function getInfohash(magnet) {
            const match = magnet.match(/urn:btih:([a-fA-F0-9]{40})/);
            return match ? match[1].toLowerCase() : null;
        }

        function playMagnet() {
            const input = document.getElementById('magnetInput').value.trim();
            const container = document.getElementById('webtor-player');
            const playBtn = document.getElementById('playBtn');
            const actionBar = document.getElementById('actionBar');
            const officialLink = document.getElementById('officialLink');

            if (!input.startsWith('magnet:?')) {
                alert('请输入有效的磁力链接 (magnet:? 开头)');
                return;
            }

            const infohash = getInfohash(input);
            if (!infohash) {
                alert('无法识别有效的 Infohash');
                return;
            }

            // 更新 UI 状态
            playBtn.innerText = '加载中...';
            playBtn.disabled = true;
            container.innerHTML = '<span style="color:#8b949e; font-size:14px;">正在连接节点，若长时间无响应说明网络受限或死种...</span>';
            actionBar.style.display = 'flex';
            officialLink.href = `https://webtor.io/${infohash}`;

            // 强制清理旧实例
            container.innerHTML = '';

            // 直接使用官方 SDK 注入播放，不传 path，让它默认播第一个
            const render = () => {
                window.webtor.push({
                    id: 'webtor-player',
                    magnet: input,
                    width: '100%',
                    height: '100%'
                });
                playBtn.innerText = '开始播放';
                playBtn.disabled = false;
            };

            if (window.webtor) {
                render();
            } else {
                let attempts = 0;
                const checkSdk = setInterval(() => {
                    if (window.webtor) {
                        clearInterval(checkSdk);
                        render();
                    }
                    if (++attempts > 50) {
                        clearInterval(checkSdk);
                        container.innerHTML = '<span style="color:#ff7b72;">SDK 加载失败，请检查网络或刷新页面</span>';
                        playBtn.innerText = '开始播放';
                        playBtn.disabled = false;
                    }
                }, 100);
            }
        }
    </script>
</body>
</html>
