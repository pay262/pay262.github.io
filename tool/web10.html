<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Webtor 云播放 (极速美化版)</title>
    <style>
        :root {
            --bg: #0b0e14; --surface: #161b22; --border: #30363d;
            --text: #e6edf3; --muted: #8b949e; --accent: #238636; --accent-hover: #2ea043;
            --card: #1f242c; --pink: #f13e7a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px 16px;
        }
        .container { width: 100%; max-width: 800px; }
        h2 { font-size: 1.25rem; margin-bottom: 6px; display: flex; align-items: center; gap: 8px;}
        p.subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.4; }

        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 14px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); font-size: 15px; outline: none; transition: 0.2s;
        }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(35, 134, 54, 0.2); }
        .input-group button {
            width: 100%; padding: 14px; border-radius: 8px; border: none;
            background: var(--accent); color: white; font-weight: 600;
            font-size: 16px; cursor: pointer; transition: background 0.2s;
        }
        .input-group button:active { background: var(--accent-hover); }
        .input-group button:disabled { opacity: 0.7; cursor: not-allowed; }

        @media (min-width: 600px) {
            .input-group { flex-direction: row; }
            .input-group input { flex: 1; }
            .input-group button { width: auto; padding: 14px 28px; }
        }

        /* 顶部快捷切换按钮 */
        #toggle-list-btn {
            display: none; width: 100%; margin-bottom: 15px; padding: 12px;
            background: rgba(241, 62, 122, 0.1); border: 1px solid rgba(241, 62, 122, 0.3);
            color: var(--pink); border-radius: 8px; font-weight: bold; font-size: 15px;
            cursor: pointer; text-align: center;
        }

        #webtor-player {
            width: 100%; aspect-ratio: 16 / 9; background: #000;
            border-radius: 10px; overflow: hidden; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #webtor-player iframe {
            width: 100% !important; height: 100% !important;
            border: none; position: absolute; top: 0; left: 0;
        }

        /* 美化版悬浮文件列表 */
        #file-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); z-index: 1000;
            justify-content: center; align-items: flex-end; /* 移动端从底部弹起 */
        }
        @media (min-width: 600px) {
            #file-modal { align-items: center; }
        }
        .modal-content {
            background: var(--card); width: 100%; max-width: 600px;
            max-height: 80vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column;
            border: 1px solid var(--border); animation: slideUp 0.3s ease-out;
        }
        @media (min-width: 600px) {
            .modal-content { border-radius: 16px; animation: fadeIn 0.2s ease-out; }
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .modal-header {
            padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px;
        }
        .modal-title { font-size: 1.1rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center;}
        .close-btn { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; padding: 0 5px; }
        .search-box {
            width: 100%; padding: 10px 14px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none;
        }
        .search-box:focus { border-color: var(--pink); }

        .file-list-scroll {
            overflow-y: auto; padding: 10px; flex: 1;
        }
        .file-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-radius: 8px; cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.2s;
        }
        .file-item:hover, .file-item:active { background: rgba(255, 255, 255, 0.08); }
        .file-item.active { background: rgba(241, 62, 122, 0.15); border-left: 3px solid var(--pink); }
        .file-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px;}
        .file-size { font-size: 12px; color: var(--muted); background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 12px; flex-shrink: 0;}
    </style>
</head>
<body>
    <div class="container">
        <h2>☁️ Webtor 云播放</h2>
        <p class="subtitle">极致解析，多源代理容灾，智能列表切换。</p>
        
        <div class="input-group">
            <input type="text" id="magnetInput" placeholder="粘贴 magnet:?xt=urn:btih:..." />
            <button onclick="parseMagnet()" id="parseBtn">开始解析</button>
        </div>

        <!-- 替代原生下拉框的按钮 -->
        <button id="toggle-list-btn" onclick="openModal()">📂 打开文件列表 (点击切换)</button>

        <div id="webtor-player">
            <span style="color:#8b949e; font-size:14px;">等待输入磁力链接...</span>
        </div>
    </div>

    <!-- 悬浮列表 UI -->
    <div id="file-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">
                    <span id="modal-title-text">文件列表</span>
                    <button class="close-btn" onclick="closeModal()">×</button>
                </div>
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜索文件名 (如 063, 001)..." oninput="filterFiles()">
            </div>
            <div class="file-list-scroll" id="file-list-container">
                <!-- 列表项通过 JS 插入 -->
            </div>
        </div>
    </div>

    <script>
        const TRACKERS = [
            '&tr=udp%3A%2F%2Fexplodie.org%3A6969',
            '&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337',
            '&tr=wss%3A%2F%2Ftracker.openwebtorrent.com'
        ].join('');

        let globalFiles = [];
        let currentMagnet = '';
        let currentInfohash = '';
        let currentFilePath = '';

        function getInfohash(magnet) {
            const match = magnet.match(/urn:btih:([a-fA-F0-9]{40})/);
            return match ? match[1].toLowerCase() : null;
        }

        // 多代理请求重试机制
        async function fetchWithRetry(url, retries = 3) {
            const proxies = [
                'https://api.allorigins.win/raw?url=',
                'https://corsproxy.io/?',
                'https://api.codetabs.com/v1/proxy?quest='
            ];
            
            for (let i = 0; i < retries; i++) {
                const proxy = proxies[i % proxies.length]; // 轮流使用代理
                try {
                    const res = await fetch(proxy + encodeURIComponent(url));
                    if (res.ok) {
                        const text = await res.text();
                        if (text.includes('<!doctype html>') || text.includes('<!DOCTYPE html>')) {
                            return text;
                        }
                    }
                } catch (e) {
                    console.warn(`请求失败，重试中 (${i+1}/${retries})...`, e);
                }
                await new Promise(r => setTimeout(r, 800)); // 每次重试等待 800ms
            }
            throw new Error('抓取彻底失败');
        }

        function parseHtmlPage(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const inputs = doc.querySelectorAll('input[data-path]');
            const files = [];
            
            inputs.forEach(input => {
                const path = input.getAttribute('data-path');
                const sizeBytes = parseInt(input.getAttribute('data-size') || '0');
                const name = input.getAttribute('aria-label');
                
                if (path && name) {
                    const sizeStr = sizeBytes > 1024 * 1024 * 1024 
                        ? (sizeBytes / 1024 / 1024 / 1024).toFixed(2) + ' GB'
                        : (sizeBytes / 1024 / 1024).toFixed(1) + ' MB';
                    files.push({ path, name, size: sizeStr });
                }
            });

            let maxPage = 1;
            let pwd = '';
            doc.querySelectorAll('a[href*="page="]').forEach(a => {
                const params = new URLSearchParams(a.getAttribute('href').split('?')[1]);
                if (params.get('page')) maxPage = Math.max(maxPage, parseInt(params.get('page')));
                if (!pwd && params.get('pwd')) pwd = params.get('pwd');
            });

            return { files, maxPage, pwd };
        }

        async function parseMagnet() {
            const input = document.getElementById('magnetInput').value.trim();
            const container = document.getElementById('webtor-player');
            const parseBtn = document.getElementById('parseBtn');
            const toggleBtn = document.getElementById('toggle-list-btn');

            if (!input.startsWith('magnet:?')) return alert('请输入有效的磁力链接');
            currentInfohash = getInfohash(input);
            if (!currentInfohash) return alert('无法识别 Hash');

            currentMagnet = input.includes('tr=') ? input : input + TRACKERS;

            parseBtn.disabled = true;
            parseBtn.innerText = '解析中...';
            toggleBtn.style.display = 'none';
            container.innerHTML = '<span style="color:#8b949e; font-size:14px;">正在提取全量文件列表，请稍候...</span>';

            try {
                parseBtn.innerText = '获取首页...';
                const baseUrl = `https://webtor.io/${currentInfohash}`;
                const firstHtml = await fetchWithRetry(baseUrl);
                const firstData = parseHtmlPage(firstHtml);
                
                let allFiles = [...firstData.files];
                
                if (firstData.maxPage > 1) {
                    for (let i = 2; i <= firstData.maxPage; i++) {
                        parseBtn.innerText = `正在获取第 ${i}/${firstData.maxPage} 页...`;
                        const pageUrl = `https://webtor.io/${currentInfohash}?pwd=${encodeURIComponent(firstData.pwd)}&page=${i}`;
                        try {
                            const pageHtml = await fetchWithRetry(pageUrl);
                            allFiles = allFiles.concat(parseHtmlPage(pageHtml).files);
                        } catch (e) {
                            console.warn(`第 ${i} 页彻底失败，跳过`);
                        }
                    }
                }

                // 去重排序
                const seen = new Set();
                globalFiles = allFiles.filter(f => {
                    if (!seen.has(f.path)) { seen.add(f.path); return true; }
                    return false;
                }).sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));

                if (globalFiles.length === 0) throw new Error('无视频文件');

                // 渲染列表
                renderFileList(globalFiles);
                
                // 显示按钮并自动播放第一个
                toggleBtn.style.display = 'block';
                toggleBtn.innerText = `📂 已解析 ${globalFiles.length} 个文件 (点击切换)`;
                
                playVideo(globalFiles[0]);

            } catch (e) {
                console.error(e);
                container.innerHTML = '<span style="color:#ff7b72; font-size:14px;">解析失败，可能是代理超时，请重新点击解析。</span>';
            }

            parseBtn.innerText = '开始解析';
            parseBtn.disabled = false;
        }

        // 渲染美化列表
        function renderFileList(files) {
            const list = document.getElementById('file-list-container');
            list.innerHTML = '';
            
            files.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.dataset.path = file.path;
                div.dataset.name = file.name.toLowerCase();
                
                // 提取文件名前面的序号用于显示
                const numMatch = file.name.match(/(\d+)/);
                const displayNum = numMatch ? numMatch[1].padStart(3, '0') : index + 1;

                div.innerHTML = `
                    <div class="file-name" title="${file.name}">${displayNum} - ${file.name}</div>
                    <div class="file-size">${file.size}</div>
                `;
                
                div.onclick = () => playVideo(file);
                list.appendChild(div);
            });
            
            document.getElementById('modal-title-text').innerText = `文件列表 (共 ${files.length} 个)`;
        }

        // 搜索过滤功能
        function filterFiles() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.file-item');
            
            items.forEach(item => {
                if (item.dataset.name.includes(keyword)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function openModal() {
            document.getElementById('file-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('file-modal').style.display = 'none';
        }

        // 播放逻辑：使用官方 iframe 接口，容错率远高于 SDK
        function playVideo(fileObj) {
            currentFilePath = fileObj.path;
            closeModal();
            
            const container = document.getElementById('webtor-player');
            // 更新列表高亮状态
            document.querySelectorAll('.file-item').forEach(el => {
                if (el.dataset.path === fileObj.path) el.classList.add('active');
                else el.classList.remove('active');
            });

            // 更新顶部按钮文字
            document.getElementById('toggle-list-btn').innerText = `▶️ 正在播放: ${fileObj.name} (点击切换)`;

            container.innerHTML = '<span style="color:#8b949e; font-size:14px;">正在连接 P2P 节点，准备视频流...</span>';

            // 构造官方 Embed URL
            const embedUrl = `https://webtor.io/embed/${currentInfohash}?path=${encodeURIComponent(fileObj.path)}`;
            
            const iframe = document.createElement('iframe');
            iframe.src = embedUrl;
            iframe.allow = "autoplay; fullscreen";
            iframe.allowFullscreen = true;
            
            // 延迟清空提示，插入 iframe
            setTimeout(() => {
                container.innerHTML = '';
                container.appendChild(iframe);
            }, 500);
        }

        // 点击遮罩层关闭
        document.getElementById('file-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
