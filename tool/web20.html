<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Webtor 云播放</title>
    <style>
        :root {
            --bg: #0b0e14; --surface: #161b22; --border: #30363d;
            --text: #e6edf3; --muted: #8b949e; --accent: #238636; --accent-hover: #2ea043;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px 16px;
        }
        .container { width: 100%; max-width: 800px; }
        h2 { font-size: 1.25rem; margin-bottom: 6px; }
        p.subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.4; }

        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 14px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); font-size: 16px; outline: none;
        }
        .input-group input:focus { border-color: var(--accent); }
        .input-group button {
            width: 100%; padding: 14px; border-radius: 8px; border: none;
            background: var(--accent); color: white; font-weight: 600;
            font-size: 16px; cursor: pointer; transition: background 0.2s;
        }
        .input-group button:active { background: var(--accent-hover); }

        @media (min-width: 600px) {
            .input-group { flex-direction: row; }
            .input-group input { flex: 1; }
            .input-group button { width: auto; padding: 14px 28px; }
        }

        /* 播放器外壳 */
        #player-wrapper {
            width: 100%; aspect-ratio: 16 / 9;
            background: #000; border-radius: 10px; overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }
        
        /* Webtor 容器 */
        #webtor-player {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); font-size: 14px;
        }

        /* 强制 iframe 铺满 */
        #webtor-player iframe {
            width: 100% !important; height: 100% !important;
            border: none; position: absolute; top: 0; left: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>☁️ Webtor 云播放</h2>
        <p class="subtitle">因公共接口资源有限，若无法播放，请刷新页面或更换磁力链接。</p>
        
        <div class="input-group">
            <input type="text" id="magnetInput" placeholder="粘贴 magnet:?xt=urn:btih:..." />
            <button onclick="playMagnet()" id="playBtn">开始播放</button>
        </div>

        <div id="player-wrapper">
            <div id="webtor-player">等待输入磁力链接...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@webtor/embed-sdk-js/dist/index.min.js" charset="utf-8" async></script>

    <script>
        function playMagnet() {
            const input = document.getElementById('magnetInput').value.trim();
            const wrapper = document.getElementById('player-wrapper');
            const playBtn = document.getElementById('playBtn');

            if (!input.startsWith('magnet:?')) {
                alert('请输入有效的磁力链接 (magnet:? 开头)');
                return;
            }

            playBtn.innerText = '解析中...';
            playBtn.style.opacity = '0.7';

            // ========== 核心修复：彻底销毁旧节点，重建新的 DOM ==========
            // 移除旧的 player 容器
            const oldPlayer = document.getElementById('webtor-player');
            if (oldPlayer) oldPlayer.remove();

            // 生成一个带随机数的新 ID，防止 Webtor SDK 内部缓存冲突
            const newId = 'webtor-player-' + Math.random().toString(36).substring(2, 9);
            const newPlayer = document.createElement('div');
            newPlayer.id = newId;
            newPlayer.innerHTML = '<span style="color:#8b949e;">正在连接服务器...</span>';
            
            // 把新容器塞回壳子里
            wrapper.appendChild(newPlayer);

            // 追加 Tracker 并加个无用的随机参数，试图绕过 API 对相同磁力的限流
            let finalMagnet = input;
            if (!input.includes('tr=')) {
                finalMagnet += '&tr=udp%3A%2F%2Fexplodie.org%3A6969&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337&tr=wss%3A%2F%2Ftracker.openwebtorrent.com';
            }
            
            // 延迟一小会儿再加载，确保 DOM 已经更新
            setTimeout(() => {
                if (window.webtor) {
                    window.webtor.push({
                        id: newId,
                        magnet: finalMagnet,
                        width: '100%',
                        height: '100%'
                    });
                } else {
                    // SDK 没加载出来的备用逻辑
                    const checkSdk = setInterval(() => {
                        if (window.webtor) {
                            clearInterval(checkSdk);
                            window.webtor.push({
                                id: newId,
                                magnet: finalMagnet,
                                width: '100%',
                                height: '100%'
                            });
                        }
                    }, 100);
                    setTimeout(() => clearInterval(checkSdk), 5000);
                }
            }, 100);

            // 恢复按钮
            setTimeout(() => {
                playBtn.innerText = '开始播放';
                playBtn.style.opacity = '1';
            }, 2000);
        }
    </script>
</body>
</html>
