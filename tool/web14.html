<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Webtor 云播放 (极速全集版)</title>
    <style>
        :root {
            --bg: #0b0e14; --surface: #161b22; --border: #30363d;
            --text: #e6edf3; --muted: #8b949e; --accent: #238636; --accent-hover: #2ea043;
            --pink: #f13e7a; --card: #1f242c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px 16px;
        }
        .container { width: 100%; max-width: 800px; }
        h2 { font-size: 1.25rem; margin-bottom: 6px; display: flex; align-items: center; gap: 8px;}
        p.subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.4; }

        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 14px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); font-size: 15px; outline: none; transition: 0.2s;
        }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(35, 134, 54, 0.2); }
        .input-group button {
            width: 100%; padding: 14px; border-radius: 8px; border: none;
            background: var(--accent); color: white; font-weight: 600;
            font-size: 16px; cursor: pointer; transition: background 0.2s;
        }
        .input-group button:active { background: var(--accent-hover); }
        .input-group button:disabled { opacity: 0.7; cursor: not-allowed; }

        @media (min-width: 600px) {
            .input-group { flex-direction: row; }
            .input-group input { flex: 1; }
            .input-group button { width: auto; padding: 14px 28px; }
        }

        /* 列表状态提示条 */
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; height: 24px;}
        #list-status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px;}
        .spinner {
            display: inline-block; width: 12px; height: 12px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: var(--pink);
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #toggle-list-btn {
            display: none; padding: 8px 16px; border-radius: 6px;
            background: rgba(241, 62, 122, 0.1); border: 1px solid rgba(241, 62, 122, 0.3);
            color: var(--pink); font-weight: bold; font-size: 14px; cursor: pointer;
            animation: fadeIn 0.3s;
        }

        #webtor-player {
            width: 100%; aspect-ratio: 16 / 9; background: #000;
            border-radius: 10px; overflow: hidden; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #webtor-player iframe, #webtor-player video {
            width: 100% !important; height: 100% !important;
            border: none; position: absolute; top: 0; left: 0;
        }

        /* 悬浮列表 UI */
        #file-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); z-index: 1000;
            justify-content: center; align-items: flex-end;
        }
        @media (min-width: 600px) { #file-modal { align-items: center; } }
        .modal-content {
            background: var(--card); width: 100%; max-width: 600px;
            max-height: 80vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column;
            border: 1px solid var(--border); animation: slideUp 0.3s ease-out;
        }
        @media (min-width: 600px) { .modal-content { border-radius: 16px; animation: fadeIn 0.2s ease-out; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .modal-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
        .modal-title { font-size: 1.1rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center;}
        .close-btn { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; padding: 0 5px; }
        .search-box {
            width: 100%; padding: 10px 14px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none;
        }
        .search-box:focus { border-color: var(--pink); }
        .file-list-scroll { overflow-y: auto; padding: 10px; flex: 1; }
        .file-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-radius: 8px; cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.2s;
        }
        .file-item:hover, .file-item:active { background: rgba(255, 255, 255, 0.08); }
        .file-item.active { background: rgba(241, 62, 122, 0.15); border-left: 3px solid var(--pink); }
        .file-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px;}
        .file-size { font-size: 12px; color: var(--muted); background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 12px; flex-shrink: 0;}
    </style>
</head>
<body>
    <div class="container">
        <h2>☁️ Webtor 云播放</h2>
        <p class="subtitle">极速直连起播，CDN 代理静默拉取完整列表。</p>
        
        <div class="input-group">
            <input type="text" id="magnetInput" placeholder="粘贴 magnet:?xt=urn:btih:..." />
            <button onclick="startPlay()" id="playBtn">开始播放</button>
        </div>

        <div class="status-bar">
            <span id="list-status"></span>
            <button id="toggle-list-btn" onclick="openModal()">📂 打开文件列表</button>
        </div>

        <div id="webtor-player">
            <span style="color:#8b949e; font-size:14px;">等待输入磁力链接...</span>
        </div>
    </div>

    <!-- 悬浮列表 UI -->
    <div id="file-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">
                    <span id="modal-title-text">文件列表</span>
                    <button class="close-btn" onclick="closeModal()">×</button>
                </div>
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 输入编号搜索，如 063..." oninput="filterFiles()">
            </div>
            <div class="file-list-scroll" id="file-list-container"></div>
        </div>
    </div>

    <!-- 官方 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@webtor/embed-sdk-js/dist/index.min.js" charset="utf-8" async></script>

    <script>
        let currentMagnet = '';
        let currentInfohash = '';
        let globalFiles = [];

        function getInfohash(magnet) {
            const match = magnet.match(/urn:btih:([a-fA-F0-9]{40})/);
            return match ? match[1].toLowerCase() : null;
        }

        // 带超时控制的 Fetch 请求
        async function fetchWithTimeout(resource, timeout = 6000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, { signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (e) {
                clearTimeout(id);
                throw e;
            }
        }

        // 解析 HTML
        function parseHtmlPage(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const inputs = doc.querySelectorAll('input[data-path]');
            const files = [];
            inputs.forEach(input => {
                const path = input.getAttribute('data-path');
                const sizeBytes = parseInt(input.getAttribute('data-size') || '0');
                const name = input.getAttribute('aria-label');
                if (path && name) {
                    const sizeStr = sizeBytes > 1024 * 1024 * 1024 
                        ? (sizeBytes / 1024 / 1024 / 1024).toFixed(2) + ' GB'
                        : (sizeBytes / 1024 / 1024).toFixed(1) + ' MB';
                    files.push({ path, name, size: sizeStr });
                }
            });

            let maxPage = 1;
            let pwd = '';
            doc.querySelectorAll('a[href*="page="]').forEach(a => {
                const params = new URLSearchParams(a.getAttribute('href').split('?')[1]);
                if (params.get('page')) maxPage = Math.max(maxPage, parseInt(params.get('page')));
                if (!pwd && params.get('pwd')) pwd = params.get('pwd');
            });
            return { files, maxPage, pwd };
        }

        function startPlay() {
            const input = document.getElementById('magnetInput').value.trim();
            const container = document.getElementById('webtor-player');
            const playBtn = document.getElementById('playBtn');
            const toggleBtn = document.getElementById('toggle-list-btn');
            const statusText = document.getElementById('list-status');

            if (!input.startsWith('magnet:?')) return alert('请输入有效的磁力链接');

            currentInfohash = getInfohash(input);
            if (!currentInfohash) return alert('无法识别有效的 Infohash');

            // 必须使用带有标准 Tracker 的 magnet
            currentMagnet = input.includes('tr=') ? input : input + '&tr=udp://explodie.org:6969&tr=wss://tracker.openwebtorrent.com&tr=wss://tracker.btorrent.xyz';

            // 重置 UI
            globalFiles = [];
            toggleBtn.style.display = 'none';
            document.getElementById('searchInput').value = '';
            statusText.innerHTML = '<span class="spinner"></span> 极速加载视频中...';
            
            // 1. 立刻用官方 SDK 起播
            playBtn.innerText = '加载中...';
            playBtn.disabled = true;
            container.innerHTML = '<span style="color:#8b949e; font-size:14px;">正在极速直连服务器...</span>';
            renderPlayer(null);

            // 2. 开启后台多通道静默抓取
            fetchListMultiChannel(currentInfohash);

            playBtn.innerText = '开始播放';
            playBtn.disabled = false;
        }

        function renderPlayer(filePath = null) {
            const container = document.getElementById('webtor-player');
            container.innerHTML = ''; 

            const render = () => {
                const config = {
                    id: 'webtor-player',
                    magnet: currentMagnet,
                    width: '100%',
                    height: '100%'
                };
                if (filePath) config.path = filePath;
                window.webtor.push(config);
            };

            if (window.webtor) {
                render();
            } else {
                let attempts = 0;
                const checkSdk = setInterval(() => {
                    if (window.webtor) {
                        clearInterval(checkSdk);
                        render();
                    }
                    if (++attempts > 50) {
                        clearInterval(checkSdk);
                        container.innerHTML = '<span style="color:#ff7b72;">SDK 加载失败</span>';
                    }
                }, 100);
            }
        }

        // 多通道并发抓取，极其稳定
        async function fetchListMultiChannel(infohash) {
            const statusText = document.getElementById('list-status');
            const toggleBtn = document.getElementById('toggle-list-btn');
            
            // 升级：更极速、抗封锁的 CDN 代理池
            const proxies = [
                'https://cors.eu.org/',                         // Cloudflare 节点，国内极快
                'https://api.codetabs.com/v1/proxy?quest=',     // 边缘节点，极度稳定
                'https://api.allorigins.win/raw?url='           // 老牌，作为最后兜底
            ];

            const fetchFirstPage = async () => {
                for (let proxy of proxies) {
                    try {
                        const url = proxy + encodeURIComponent(`https://webtor.io/${infohash}`);
                        const res = await fetchWithTimeout(url, 6000);
                        if (res.ok) {
                            const text = await res.text();
                            if (text.includes('data-path')) return text; // 确保拿到了有效网页
                        }
                    } catch (e) { console.warn('代理失败:', proxy); }
                }
                return null;
            };

            try {
                const firstHtml = await fetchFirstPage();
                if (!firstHtml) throw new Error('全部代理失败');

                const firstData = parseHtmlPage(firstHtml);
                let allFiles = [...firstData.files];

                if (firstData.maxPage > 1) {
                    statusText.innerHTML = `<span class="spinner"></span> 正在拉取全量列表 (1/${firstData.maxPage})...`;
                    
                    // 并发抓取剩余页
                    const pagePromises = [];
                    for (let i = 2; i <= firstData.maxPage; i++) {
                        const pageUrl = `https://webtor.io/${infohash}?pwd=${encodeURIComponent(firstData.pwd)}&page=${i}`;
                        
                        // 对于后续页，用同样的代理池并发
                        const fetchPage = async () => {
                            for (let proxy of proxies) {
                                try {
                                    const res = await fetchWithTimeout(proxy + encodeURIComponent(pageUrl), 5000);
                                    if (res.ok) {
                                        const text = await res.text();
                                        if (text.includes('data-path')) return parseHtmlPage(text).files;
                                    }
                                } catch (e) {}
                            }
                            return [];
                        };
                        pagePromises.push(fetchPage());
                    }

                    const results = await Promise.all(pagePromises);
                    results.forEach(files => { allFiles = allFiles.concat(files); });
                }

                // 去重排序
                const seen = new Set();
                globalFiles = allFiles.filter(f => {
                    if (!seen.has(f.path)) { seen.add(f.path); return true; }
                    return false;
                }).sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));

                if (globalFiles.length > 0) {
                    renderFileList(globalFiles);
                    statusText.innerHTML = `<span style="color:var(--accent)">✅</span> 已获取全部 ${globalFiles.length} 个视频`;
                    toggleBtn.style.display = 'block';
                } else {
                    throw new Error('无文件');
                }

            } catch (e) {
                console.warn(e);
                statusText.innerText = '网络受限，无法获取完整列表 (可点重试)';
            }
        }

        function renderFileList(files) {
            const list = document.getElementById('file-list-container');
            list.innerHTML = '';
            
            files.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.dataset.path = file.path;
                div.dataset.name = file.name.toLowerCase();
                
                const numMatch = file.name.match(/(\d+)/);
                const displayNum = numMatch ? numMatch[1].padStart(3, '0') : index + 1;

                div.innerHTML = `
                    <div class="file-name" title="${file.name}">${displayNum} - ${file.name}</div>
                    <div class="file-size">${file.size}</div>
                `;
                
                div.onclick = () => switchVideo(file, div);
                list.appendChild(div);
            });
            
            document.getElementById('modal-title-text').innerText = `文件列表 (共 ${files.length} 个)`;
        }

        function switchVideo(fileObj, divElement) {
            closeModal();
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            divElement.classList.add('active');
            renderPlayer(fileObj.path);
        }

        function filterFiles() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.file-item').forEach(item => {
                item.style.display = item.dataset.name.includes(keyword) ? 'flex' : 'none';
            });
        }

        function openModal() { document.getElementById('file-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('file-modal').style.display = 'none'; }
        document.getElementById('file-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
