<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Webtor 云播放 (增强版)</title>
    <style>
        :root {
            --bg: #0b0e14; --surface: #161b22; --border: #30363d;
            --text: #e6edf3; --muted: #8b949e; --accent: #238636; --accent-hover: #2ea043;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px 16px;
        }
        .container { width: 100%; max-width: 800px; }
        h2 { font-size: 1.25rem; margin-bottom: 6px; }
        p.subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.4; }

        .input-group {
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;
        }
        .input-group input {
            width: 100%; padding: 14px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); font-size: 16px; outline: none;
        }
        .input-group input:focus { border-color: var(--accent); }
        .input-group button {
            width: 100%; padding: 14px; border-radius: 8px; border: none;
            background: var(--accent); color: white; font-weight: 600;
            font-size: 16px; cursor: pointer; transition: background 0.2s;
        }
        .input-group button:active { background: var(--accent-hover); }
        .input-group button:disabled { opacity: 0.7; cursor: not-allowed; }

        @media (min-width: 600px) {
            .input-group { flex-direction: row; }
            .input-group input { flex: 1; }
            .input-group button { width: auto; padding: 14px 28px; }
        }

        /* 新增：文件列表切换区域 */
        #file-list-container {
            display: none; margin-bottom: 20px; animation: fadeIn 0.3s;
        }
        #file-list-container label {
            display: block; color: var(--muted); font-size: 0.9rem; margin-bottom: 8px;
        }
        #file-select {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid var(--accent); background: var(--surface);
            color: var(--text); font-size: 15px; outline: none;
        }

        /* 播放器容器 */
        #webtor-player {
            width: 100%; aspect-ratio: 16 / 9; background: #000;
            border-radius: 10px; overflow: hidden; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); position: relative;
        }
        #webtor-player iframe, #webtor-player video {
            width: 100% !important; height: 100% !important;
            border: none; position: absolute; top: 0; left: 0;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h2>☁️ Webtor 云播放 (增强版)</h2>
        <p class="subtitle">支持多文件智能解析与切换。</p>
        
        <div class="input-group">
            <input type="text" id="magnetInput" placeholder="粘贴 magnet:?xt=urn:btih:..." />
            <button onclick="playMagnet()" id="playBtn">开始播放</button>
        </div>

        <!-- 新增：多文件切换列表 -->
        <div id="file-list-container">
            <label>📂 种子内包含多个视频，请选择播放：</label>
            <select id="file-select"></select>
        </div>

        <div id="webtor-player">
            <span style="color:#8b949e; font-size:14px;">等待输入磁力链接...</span>
        </div>
    </div>

    <!-- 依然保留 SDK 作为兜底方案 -->
    <script src="https://cdn.jsdelivr.net/npm/@webtor/embed-sdk-js/dist/index.min.js" charset="utf-8" async></script>

    <script>
        // 公共 Tracker 补充，提高解析成功率
        const TRACKERS = [
            '&tr=udp%3A%2F%2Fexplodie.org%3A6969',
            '&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337',
            '&tr=wss%3A%2F%2Ftracker.openwebtorrent.com'
        ].join('');

        // 视频后缀正则过滤
        const VIDEO_REGEX = /\.(mp4|mkv|avi|webm|mov|flv|wmv)$/i;

        async function playMagnet() {
            const input = document.getElementById('magnetInput').value.trim();
            const container = document.getElementById('webtor-player');
            const playBtn = document.getElementById('playBtn');
            const listContainer = document.getElementById('file-list-container');
            const fileSelect = document.getElementById('file-select');

            if (!input.startsWith('magnet:?')) {
                alert('请输入有效的磁力链接 (magnet:? 开头)');
                return;
            }

            // UI 状态重置
            playBtn.disabled = true;
            playBtn.innerText = '智能解析中...';
            container.innerHTML = '<span style="color:#8b949e; font-size:14px;">正在获取种子信息，请稍候...</span>';
            listContainer.style.display = 'none';

            let finalMagnet = input;
            if (!input.includes('tr=')) {
                finalMagnet = input + TRACKERS;
            }

            try {
                // 尝试请求 Webtor 官方 API 获取文件列表 (通过 CORS 代理防止跨域拦截)
                const apiUrl = `https://webtor.io/api/v1/magnet?magnet=${encodeURIComponent(finalMagnet)}`;
                // 使用 allorigins 代理请求
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`;
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('API 请求失败');
                
                const data = await response.json();
                
                // 过滤出视频文件
                if (data && data.files && data.files.length > 0) {
                    const videoFiles = data.files.filter(f => VIDEO_REGEX.test(f.path));
                    
                    if (videoFiles.length > 0) {
                        // 渲染下拉选择框
                        fileSelect.innerHTML = '';
                        videoFiles.forEach((file, index) => {
                            const option = document.createElement('option');
                            option.value = file.index;
                            // 显示文件名和大小
                            const sizeMB = (file.size / 1024 / 1024).toFixed(1);
                            option.textContent = `[${sizeMB} MB] ${file.path.split('/').pop()}`;
                            fileSelect.appendChild(option);
                        });

                        listContainer.style.display = 'block';
                        
                        // 监听切换事件
                        fileSelect.onchange = (e) => {
                            renderIframe(finalMagnet, e.target.value);
                        };

                        // 默认播放第一个视频文件
                        renderIframe(finalMagnet, videoFiles[0].index);
                        
                        playBtn.innerText = '开始播放';
                        playBtn.disabled = false;
                        return; // 成功使用外置列表，结束函数
                    }
                }
            } catch (e) {
                console.warn("解析多文件列表失败，将回退到默认播放模式:", e);
            }

            // 兜底方案：如果获取列表失败（或被CORS拦截），直接调用官方 SDK 渲染
            // 缺点：移动端可能不显示内置切换列表
            renderSDK(finalMagnet);
            playBtn.innerText = '开始播放';
            playBtn.disabled = false;
        }

        // 渲染自定义控制的 iframe 播放器（支持 fileIndex 参数）
        function renderIframe(magnet, fileIndex) {
            const container = document.getElementById('webtor-player');
            // 直接构造官方的 Embed URL，并传入特定的文件索引
            const embedUrl = `https://webtor.io/embed/${encodeURIComponent(magnet)}?fileIndex=${fileIndex}`;
            
            container.innerHTML = `<iframe src="${embedUrl}" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
        }

        // 渲染官方 SDK 播放器（兜底方案）
        function renderSDK(magnet) {
            const container = document.getElementById('webtor-player');
            container.innerHTML = ''; // 清空容器
            
            if (window.webtor) {
                window.webtor.push({
                    id: 'webtor-player',
                    magnet: magnet,
                    width: '100%',
                    height: '100%'
                });
            } else {
                // 如果 SDK 还没加载完，延迟一下
                const checkSdk = setInterval(() => {
                    if (window.webtor) {
                        clearInterval(checkSdk);
                        window.webtor.push({
                            id: 'webtor-player',
                            magnet: magnet,
                            width: '100%',
                            height: '100%'
                        });
                    }
                }, 100);
                setTimeout(() => clearInterval(checkSdk), 5000);
            }
        }
    </script>
</body>
</html>
