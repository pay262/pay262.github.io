<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webtor 云播放</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0b0e14; color: #e6edf3; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; font-size: 16px; }
        button { padding: 12px 24px; border-radius: 8px; border: none; background: #238636; color: white; font-weight: 600; cursor: pointer; font-size: 16px; }
        button:hover { background: #2ea043; }
        #player-container { width: 100%; min-height: 400px; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #8b949e; }
    </style>
</head>
<body>
    <div class="container">
        <h2>☁️ Webtor 云播放</h2>
        <p style="color: #8b949e; font-size: 14px;">粘贴磁力链接，由 Webtor 服务器解析并提供流媒体播放。</p>
        
        <div class="input-group">
            <input type="text" id="magnetInput" placeholder="magnet:?xt=urn:btih:..." />
            <button onclick="playMagnet()">开始播放</button>
        </div>

        <div id="player-container">
            等待输入磁力链接...
        </div>
    </div>

    <!-- 引入 Webtor 官方 Embed SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@webtor/embed-sdk-js/dist/index.min.js" charset="utf-8" async></script>

    <script>
        function playMagnet() {
            const magnet = document.getElementById('magnetInput').value.trim();
            const container = document.getElementById('player-container');

            if (!magnet.startsWith('magnet:?')) {
                alert('请输入有效的磁力链接 (magnet:? 开头)');
                return;
            }

            // 清空容器并创建 video 标签
            container.innerHTML = '';
            const video = document.createElement('video');
            video.controls = true;
            video.style.width = '100%';
            video.style.height = '100%';
            video.src = magnet;

            container.appendChild(video);

            // 初始化 Webtor SDK
            // 注意：官方 SDK 可能会自动查找页面上的 <video> 标签并接管
            // 如果视频没有自动加载，可以尝试下面的手动触发方式
            if (window.webtor) {
                window.webtor.push({
                    id: 'player-container',
                    magnet: magnet,
                    width: '100%',
                    height: '400px'
                });
            } else {
                // 如果 SDK 还没加载完，等待一下再试
                const checkSdk = setInterval(() => {
                    if (window.webtor) {
                        clearInterval(checkSdk);
                        window.webtor.push({
                            id: 'player-container',
                            magnet: magnet,
                            width: '100%',
                            height: '400px'
                        });
                    }
                }, 100);
                // 设置超时，避免无限等待
                setTimeout(() => clearInterval(checkSdk), 5000);
            }
        }
    </script>
</body>
</html>
