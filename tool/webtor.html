<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Webtor 云播放</title>
    <style>
        :root {
            --bg: #0b0e14;
            --surface: #151a23;
            --border: #262d3a;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #22c55e; /* 绿色按钮 */
            --accent-hover: #16a34a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }
        .container { width: 100%; max-width: 800px; }
        
        h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 6px; }
        p.subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.4; }

        /* 优化手机端输入框布局 */
        .input-group {
            display: flex;
            flex-direction: column; /* 手机端默认上下排列 */
            gap: 12px;
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 16px; /* 防止 iOS 自动放大 */
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: var(--accent); }
        
        .input-group button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap; /* 防止文字换行 */
        }
        .input-group button:active { background: var(--accent-hover); }

        /* PC 端恢复左右排列 */
        @media (min-width: 600px) {
            .input-group { flex-direction: row; }
            .input-group input { flex: 1; }
            .input-group button { width: auto; padding: 14px 28px; }
        }

        /* 播放器容器 */
        #player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: var(--muted);
            font-size: 0.9rem;
        }
        
        /* Webtor 注入 iframe 后让其铺满 */
        #player-container iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>☁️ Webtor 云播放</h2>
        <p class="subtitle">由 Webtor 服务器解析，自动识别多文件供您选择。</p>
        
        <div class="input-group">
            <input type="text" id="magnetInput" placeholder="粘贴 magnet:?xt=urn:btih:..." />
            <button onclick="playMagnet()" id="playBtn">开始播放</button>
        </div>

        <div id="player-container">
            <!-- 这里是初始占位，生成播放器后会被覆盖 -->
            等待输入磁力链接...
        </div>
    </div>

    <!-- 引入 Webtor 官方 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@webtor/embed-sdk-js/dist/index.min.js" charset="utf-8" async></script>

    <script>
        function playMagnet() {
            const magnet = document.getElementById('magnetInput').value.trim();
            const container = document.getElementById('player-container');
            const playBtn = document.getElementById('playBtn');

            if (!magnet.startsWith('magnet:?')) {
                alert('请输入有效的磁力链接 (magnet:? 开头)');
                return;
            }

            // 更改状态提示
            playBtn.innerText = '解析中...';
            playBtn.style.opacity = '0.7';
            container.innerHTML = '<div style="color:#8b949e;">正在连接服务器解析种子，请稍候...</div>';

            // 清空容器，准备给 Webtor 插入 iframe
            // Webtor SDK 需要一个唯一的容器 ID 或者直接传入 DOM
            container.id = 'webtor-player-' + Date.now();
            const currentId = container.id;

            // 延迟一下等待 DOM 更新
            setTimeout(() => {
                if (window.webtor) {
                    // 使用官方 SDK 标准方法推入播放器
                    window.webtor.push({
                        id: currentId,
                        magnet: magnet,
                        width: '100%',
                        height: '100%',
                        // 关键配置：告诉 Webtor 自动处理播放列表
                        // Webtor 的 iframe 内部自带文件切换 UI
                    });
                    
                    // 恢复按钮
                    playBtn.innerText = '开始播放';
                    playBtn.style.opacity = '1';
                    
                    // 监听 iframe 加载事件，清除文字占位
                    setTimeout(() => {
                        const iframe = document.querySelector(`#${currentId} iframe`);
                        if(iframe) {
                            container.innerHTML = '';
                            container.appendChild(iframe);
                        }
                    }, 1000);

                } else {
                    container.innerHTML = '<div style="color:#ef4444;">Webtor SDK 加载失败，请刷新页面重试。</div>';
                    playBtn.innerText = '开始播放';
                    playBtn.style.opacity = '1';
                }
            }, 100);
        }
    </script>
</body>
</html>
