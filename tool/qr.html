<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 禁止缩放 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>二维码工具 · 生成 / 解码</title>
<style>
  :root{
    --bg:#f4f5f9;
    --card:#ffffff;
    --text:#161a23;
    --muted:#6b7280;
    --line:#e4e6ee;
    --accent:#5b5bd6;
    --accent2:#7b7bf0;
    --ok:#16a34a;
    --err:#dc2626;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1016;
      --card:#171a22;
      --text:#e9ebf2;
      --muted:#98a0b0;
      --line:#282d3a;
      --ok:#4ade80;
      --err:#f87171;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    padding:26px 16px 64px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 400px at 50% -160px, rgba(91,91,214,.12), transparent 70%),
      var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1000px;margin:0 auto;}
  header{text-align:center;margin-bottom:22px;}
  h1{font-size:25px;margin:0 0 6px;letter-spacing:-.02em;}
  .sub{margin:0;color:var(--muted);font-size:13.5px;}

  .tabs{
    display:flex;gap:4px;background:var(--card);border:1px solid var(--line);
    padding:4px;border-radius:12px;width:fit-content;margin:0 auto 20px;
  }
  .tab{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:500;
    padding:8px 26px;border-radius:9px;cursor:pointer;transition:.18s;
  }
  .tab:hover{color:var(--text);}
  .tab.active{background:var(--accent);color:#fff;}

  .panel{display:none;}
  .panel.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .grid{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start;}
  
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:0 1px 3px rgba(16,24,40,.05);
  }

  .lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;}
  .lbl-row{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;margin-bottom:8px;
  }
  .lbl-tools{display:flex;align-items:center;gap:8px;}
  .counter{
    font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .counter.over{color:var(--err);font-weight:600;}

  .mini-btn{
    padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    color:var(--text);font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;transition:.15s;
    white-space:nowrap;
  }
  .mini-btn:hover{border-color:var(--accent);color:var(--accent);}
  .mini-btn:active{transform:translateY(1px);}

  textarea{
    width:100%;min-height:118px;resize:vertical;padding:12px 14px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--text);
    font:inherit;font-size:14.5px;line-height:1.6;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,214,.15);}
  textarea::placeholder{color:var(--muted);opacity:.8;}

  .field{display:flex;flex-direction:column;gap:7px;margin-top:14px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--muted);}
  .row{display:flex;gap:14px;}
  .row.two > *{flex:1;min-width:0;}

  input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;}
  select{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font:inherit;font-size:14px;outline:none;cursor:pointer;
  }
  select:focus{border-color:var(--accent);}
  .color-row{display:flex;gap:10px;}
  input[type=color]{
    width:56px;height:40px;padding:3px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);cursor:pointer;
  }
  .hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6;}

  .preview-card{display:flex;flex-direction:column;gap:14px;position:sticky;top:20px;}
  .qr-wrap{
    position:relative;display:grid;place-items:center;min-height:250px;padding:16px;
    background:var(--bg);border:1px dashed var(--line);border-radius:12px;
  }
  #qrCanvas{max-width:100%;height:auto;display:block;border-radius:6px;object-fit:contain;}
  #qrCanvas[hidden]{display:none;}
  .empty{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    padding:24px;color:var(--muted);font-size:13.5px;
    background:var(--bg);border-radius:12px;
  }
  .empty[hidden]{display:none;}

  .btn{
    padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--text);font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:.15s;
    text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent2);border-color:var(--accent2);color:#fff;}
  .actions{display:flex;gap:10px;}
  .actions .btn{flex:1;}

  .dropzone{
    border:2px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;
    color:var(--muted);cursor:pointer;transition:.18s;background:var(--bg);font-size:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .dropzone:hover{border-color:var(--accent);}
  .dropzone.over{border-color:var(--accent);background:rgba(91,91,214,.08);color:var(--accent);}
  .dropzone p{margin:0 0 6px;}
  .dropzone .hint{margin-top:10px;}
  .link{background:none;border:0;padding:0 2px;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline;}
  #btnCamera{width:100%;margin-top:14px;}

  .status{font-size:13px;margin-top:10px;min-height:18px;color:var(--muted);}
  .status.ok{color:var(--ok);}
  .status.error{color:var(--err);}

  .cam-modal{
    position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;
    background:rgba(8,10,16,.72);backdrop-filter:blur(4px);
  }
  .cam-modal[hidden]{display:none;}
  .cam-box{width:100%;max-width:520px;background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line);}
  #camVideo{width:100%;display:block;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover;}
  .cam-actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--muted);}

  .img-modal{
    position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
    background:rgba(8,10,16,.8);backdrop-filter:blur(4px);
  }
  .img-modal[hidden]{display:none;}
  .img-box{
    width:100%;max-width:360px;background:var(--card);border-radius:16px;
    padding:18px;border:1px solid var(--line);text-align:center;
  }
  .img-box img{
    width:100%;max-width:290px;height:auto;display:block;margin:0 auto;
    border-radius:10px;background:#fff;border:1px solid var(--line);
  }
  .img-tip{font-size:13px;color:var(--muted);margin:14px 0;line-height:1.6;}
  .img-actions{display:flex;gap:10px;}
  .img-actions .btn{flex:1;}

  .toast{
    position:fixed;left:50%;bottom:34px;z-index:100;padding:10px 20px;border-radius:10px;
    background:#1f2430;color:#fff;font-size:13.5px;opacity:0;pointer-events:none;
    transform:translateX(-50%) translateY(12px);transition:.25s;
    max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* =======================================================
     移动端适配
     ======================================================= */
  @media (max-width: 820px){
    body{
      padding: 8px 10px;
      height: 100dvh;
      overflow: hidden;
    }
    .app{
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    header{
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    h1{ font-size: 18px; margin-bottom: 2px; }
    .sub{ font-size: 11px; }
    .tabs{
      margin-bottom: 10px;
      padding: 3px;
      flex-shrink: 0;
    }
    .tab{ padding: 6px 20px; font-size: 13px; }

    .panel.active{
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .grid{
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
      align-items: stretch;
    }

    .card{ padding: 12px; }

    /* ---- 生成页 ---- */
    /* 输入卡片自适应，预览卡片占剩余空间 */
    #panel-gen .grid > .card:first-child{
      flex: 0 0 auto;
    }
    #panel-gen .grid > .card:last-child{
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #panel-gen .preview-card .qr-wrap{
      flex: 1;
      min-height: 140px;
    }

    /* ---- 解码页：上下按 1 : 1.1 比例分配 ---- */
    #panel-dec .grid > .card:first-child{
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #panel-dec .grid > .card:last-child{
      flex: 1.1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    /* 上传卡片内部：dropzone 占满，摄像头按钮固定在底部 */
    #panel-dec .dropzone{
      flex: 1;
      min-height: 0;
    }
    #panel-dec #btnCamera{
      flex-shrink: 0;
    }
    /* 结果卡片内部：文本框占满，按钮固定在底部 */
    #panel-dec .grid > .card:last-child textarea{
      flex: 1;
      min-height: 0;
      height: auto;
      resize: none;
    }
    #panel-dec .grid > .card:last-child .actions{
      flex-shrink: 0;
    }

    textarea{
      font-size: 13.5px;
      padding: 8px 10px;
    }
    .field{ margin-top: 8px; gap: 4px; }
    .field label{ font-size: 11.5px; }
    .hint{ display: none; }
    .preview-card{ position: static; }
    .qr-wrap{ padding: 10px; }
    #qrCanvas{ max-height: 25vh; }

    .actions .btn{ padding: 8px 12px; font-size: 13px; }
    .mini-btn{ padding: 4px 10px; font-size: 11.5px; }
    .counter{ font-size: 11px; }
    select{ padding: 8px 10px; font-size: 13px; }
    input[type=color]{ height: 34px; }

    .dropzone p{ font-size: 12.5px; }
    #btnCamera{ padding: 8px 12px; font-size: 13px; margin-top: 10px; }
    .lbl{ font-size: 11.5px; }
    .status{ font-size: 12px; margin-top: 6px; min-height: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>二维码工具</h1>
    <p class="sub">在线生成 & 识别二维码 · 纯前端处理，数据不会上传</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="gen">生成</button>
    <button class="tab" data-tab="dec">解码</button>
  </nav>

  <!-- ============ 生成 ============ -->
  <section class="panel active" id="panel-gen">
    <div class="grid">
      <div class="card">
        <div class="lbl-row">
          <label class="lbl" for="genText">内容</label>
          <div class="lbl-tools">
            <span class="counter" id="genCounter">0 / 2900 字节</span>
            <button class="mini-btn" id="btnPaste" type="button">粘贴</button>
            <button class="mini-btn" id="btnClear" type="button">清空</button>
          </div>
        </div>
        <textarea id="genText" placeholder="输入网址、文本、WIFI 信息……">https://example.com</textarea>

        <div class="field">
          <label for="genSize">尺寸 <span id="sizeVal">320</span> px</label>
          <input type="range" id="genSize" min="128" max="1024" step="32" value="320">
        </div>

        <div class="row two">
          <div class="field">
            <label for="genEcl">容错等级</label>
            <select id="genEcl">
              <option value="L">L · 低 (7%)</option>
              <option value="M" selected>M · 中 (15%)</option>
              <option value="Q">Q · 较高 (25%)</option>
              <option value="H">H · 高 (30%)</option>
            </select>
          </div>
          <div class="field">
            <label>配色</label>
            <div class="color-row">
              <input type="color" id="genFg" value="#000000" title="前景色">
              <input type="color" id="genBg" value="#ffffff" title="背景色">
            </div>
          </div>
        </div>
      </div>

      <div class="card preview-card">
        <div class="qr-wrap">
          <canvas id="qrCanvas"></canvas>
          <div class="empty" id="qrEmpty">二维码将显示在这里</div>
        </div>
        <div class="actions">
          <button class="btn primary" id="btnDownload">下载 PNG</button>
          <button class="btn" id="btnCopy">复制图片</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 解码 ============ -->
  <section class="panel" id="panel-dec">
    <div class="grid">
      <div class="card">
        <div class="dropzone" id="dropzone">
          <p>拖拽图片到这里</p>
          <p>或 <button class="link" id="btnPick" type="button">选择图片</button></p>
          <p class="hint">支持 PNG / JPG / GIF / WebP<br>也可以直接 Ctrl + V 粘贴截图</p>
          <input type="file" id="fileInput" accept="image/*" hidden>
        </div>
        <button class="btn" id="btnCamera">📷 使用摄像头扫码</button>
      </div>

      <div class="card">
        <label class="lbl" for="decResult">识别结果</label>
        <textarea id="decResult" readonly placeholder="识别结果会显示在这里"></textarea>
        <div class="actions" style="margin-top:10px">
          <button class="btn primary" id="btnCopyResult">复制</button>
          <button class="btn" id="btnOpenResult">打开链接</button>
        </div>
        <div class="status" id="decStatus"></div>
      </div>
    </div>
  </section>
</div>

<!-- 摄像头弹层 -->
<div class="cam-modal" id="camModal" hidden>
  <div class="cam-box">
    <video id="camVideo" playsinline autoplay muted></video>
    <div class="cam-actions">
      <span>把二维码对准摄像头…</span>
      <button class="btn" id="btnCamClose">关闭</button>
    </div>
  </div>
</div>

<!-- 图片保存弹层 -->
<div class="img-modal" id="imgModal" hidden>
  <div class="img-box">
    <img id="imgPreview" alt="二维码">
    <p class="img-tip" id="imgTip">长按上方图片即可保存到相册</p>
    <div class="img-actions">
      <a class="btn primary" id="btnImgDownload" download="qrcode.png">下载</a>
      <button class="btn" id="btnImgClose" type="button">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
  if (typeof qrcode === 'undefined') {
    document.write('<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"><\/script>');
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script>
(function () {
  'use strict';

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  /* ---------------- Toast ---------------- */
  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ---------------- 环境判断 ---------------- */
  function isMobileEnv() {
    const ua = navigator.userAgent || '';
    if (/MicroMessenger|QQ\/|Weibo|AlipayClient|QQBrowser/i.test(ua)) return true;
    if (/Android|iPhone|iPad|iPod|HarmonyOS|Windows Phone|Mobile/i.test(ua)) return true;
    if (navigator.maxTouchPoints > 1 && Math.min(window.innerWidth, window.innerHeight) < 900) return true;
    return false;
  }

  /* ---------------- 标签切换 ---------------- */
  function activateTab(name) {
    $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    $$('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
  }
  $$('.tab').forEach(t => t.addEventListener('click', () => activateTab(t.dataset.tab)));

  /* =========================================================
     生成
     ========================================================= */
  const genText   = $('#genText');
  const genCounter= $('#genCounter');
  const qrCanvas  = $('#qrCanvas');
  const qrEmpty   = $('#qrEmpty');
  const sizeInput = $('#genSize');
  const sizeVal   = $('#sizeVal');
  const genEcl    = $('#genEcl');
  const genFg     = $('#genFg');
  const genBg     = $('#genBg');

  const MAX_BYTES = 2900;
  let qrReady = false;

  try {
    if (typeof qrcode !== 'undefined' && qrcode.stringToBytesFuncs &&
        qrcode.stringToBytesFuncs['UTF-8']) {
      qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    }
  } catch (e) { /* 忽略 */ }

  function byteLength(str) {
    try { return new TextEncoder().encode(str).length; }
    catch (e) {
      let n = 0;
      for (let i = 0; i < str.length; i++) n += str.charCodeAt(i) < 128 ? 1 : 3;
      return n;
    }
  }

  function updateCounter() {
    const bytes = byteLength(genText.value);
    genCounter.textContent = bytes + ' / ' + MAX_BYTES + ' 字节';
    genCounter.classList.toggle('over', bytes > MAX_BYTES);
  }

  function resetPreview(msg) {
    qrReady = false;
    qrCanvas.hidden = true;
    qrEmpty.hidden = false;
    qrEmpty.textContent = msg || '二维码将显示在这里';
  }

  let renderTimer = null;
  let renderToken = 0;

  function scheduleRender(delay) {
    qrReady = false;
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderQR, delay === undefined ? 300 : delay);
  }

  function renderQR() {
    const text = genText.value;
    if (!text.trim()) { resetPreview(); return; }

    if (typeof qrcode === 'undefined') {
      resetPreview('二维码库加载失败，请检查网络后刷新页面');
      return;
    }

    const bytes = byteLength(text);
    if (bytes > MAX_BYTES) {
      resetPreview('内容过长（' + bytes + ' 字节）已超过二维码容量上限，请精简后再试');
      return;
    }

    qrEmpty.hidden = false;
    qrEmpty.textContent = '生成中…';

    const token = ++renderToken;
    setTimeout(function () {
      if (token !== renderToken) return;
      drawQR(text, token);
    }, 0);
  }

  function drawQR(text, token) {
    let qr;
    try {
      qr = qrcode(0, genEcl.value);
      qr.addData(text);
      qr.make();
    } catch (e) {
      console.error(e);
      if (token === renderToken) resetPreview('内容过长或包含不支持的内容，无法生成二维码');
      return;
    }
    if (token !== renderToken) return;

    const count      = qr.getModuleCount();
    const targetSize = Number(sizeInput.value) || 320;
    const marginMod  = 2;
    const totalMod   = count + marginMod * 2;

    let cell = Math.floor(targetSize / totalMod);
    if (cell < 2) cell = 2;

    const px = totalMod * cell;

    qrCanvas.width  = px;
    qrCanvas.height = px;
    qrCanvas.style.width  = '';
    qrCanvas.style.height = '';

    const ctx = qrCanvas.getContext('2d');
    ctx.fillStyle = genBg.value;
    ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = genFg.value;

    for (let row = 0; row < count; row++) {
      for (let col = 0; col < count; col++) {
        if (qr.isDark(row, col)) {
          ctx.fillRect(
            (col + marginMod) * cell,
            (row + marginMod) * cell,
            cell,
            cell
          );
        }
      }
    }

    qrCanvas.hidden = false;
    qrEmpty.hidden = true;
    qrReady = true;
  }

  genText.addEventListener('input', function () {
    updateCounter();
    scheduleRender();
  });
  genEcl.addEventListener('change', () => scheduleRender(0));
  genFg.addEventListener('input', () => scheduleRender(0));
  genBg.addEventListener('input', () => scheduleRender(0));
  sizeInput.addEventListener('input', function () {
    sizeVal.textContent = sizeInput.value;
    scheduleRender(0);
  });

  /* ---- 粘贴按钮 ---- */
  async function pasteToInput() {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      toast('当前浏览器不支持读取剪贴板，请手动按 Ctrl+V');
      genText.focus();
      return;
    }
    try {
      const text = await navigator.clipboard.readText();
      if (!text) { toast('剪贴板里没有文本内容'); return; }

      genText.value = text;
      updateCounter();
      scheduleRender(0);
      genText.focus();

      const bytes = byteLength(text);
      if (bytes > MAX_BYTES) {
        toast('已粘贴，但内容过长（' + bytes + ' 字节）');
      } else {
        toast('已粘贴 ' + text.length + ' 个字符');
      }
    } catch (err) {
      console.warn(err);
      toast('读取剪贴板被拒绝，请手动按 Ctrl+V 粘贴');
      genText.focus();
    }
  }
  $('#btnPaste').addEventListener('click', pasteToInput);

  /* ---- 清空按钮 ---- */
  $('#btnClear').addEventListener('click', function () {
    genText.value = '';
    updateCounter();
    resetPreview();
    genText.focus();
  });

  /* =========================================================
     图片导出与保存
     ========================================================= */
  const imgModal = $('#imgModal');
  const imgPreview = $('#imgPreview');
  const imgTip = $('#imgTip');
  const btnImgDownload = $('#btnImgDownload');
  let imgModalUrl = null;

  function showImageModal(url, filename, tipText) {
    closeImageModal(true);
    imgModalUrl = url;
    imgPreview.src = url;
    btnImgDownload.href = url;
    btnImgDownload.download = filename;
    imgTip.textContent = tipText || '长按上方图片即可保存到相册';
    imgModal.hidden = false;
  }

  function closeImageModal(keepUrl) {
    imgModal.hidden = true;
    imgPreview.removeAttribute('src');
    if (imgModalUrl && !keepUrl) {
      URL.revokeObjectURL(imgModalUrl);
      imgModalUrl = null;
    }
  }

  $('#btnImgClose').addEventListener('click', () => closeImageModal(false));
  imgModal.addEventListener('click', e => { if (e.target === imgModal) closeImageModal(false); });

  function exportQRBlob() {
    return new Promise(function (resolve, reject) {
      if (typeof qrCanvas.toBlob === 'function') {
        try {
          qrCanvas.toBlob(function (blob) {
            if (blob) resolve(blob);
            else reject(new Error('toBlob 返回空'));
          }, 'image/png');
          return;
        } catch (e) { /* 继续走回退方案 */ }
      }
      try {
        const dataUrl = qrCanvas.toDataURL('image/png');
        const base64 = dataUrl.split(',')[1];
        const bin = atob(base64);
        const len = bin.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
        resolve(new Blob([bytes], { type: 'image/png' }));
      } catch (e) {
        reject(e);
      }
    });
  }

  $('#btnDownload').addEventListener('click', async function () {
    if (!qrReady) { toast('二维码还没生成好，请稍等'); return; }

    const filename = 'qrcode-' + Date.now() + '.png';
    let blob;
    try {
      blob = await exportQRBlob();
    } catch (e) {
      console.error(e);
      toast('图片导出失败，请刷新页面重试');
      return;
    }

    const url = URL.createObjectURL(blob);

    if (isMobileEnv()) {
      showImageModal(url, filename, '长按上方图片即可保存到相册（微信内请点右上角…选择保存图片）');
      return;
    }

    try {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast('已开始下载');
      setTimeout(() => URL.revokeObjectURL(url), 6000);
    } catch (e) {
      console.error(e);
      showImageModal(url, filename, '浏览器未自动下载，请右键图片另存为');
    }
  });

  /* ---- 复制图片 ---- */
  $('#btnCopy').addEventListener('click', async function () {
    if (!qrReady) { toast('二维码还没生成好，请稍等'); return; }
    if (typeof ClipboardItem === 'undefined' || !navigator.clipboard || !navigator.clipboard.write) {
      toast('当前浏览器不支持复制图片，请用下载');
      return;
    }
    try {
      const blob = await exportQRBlob();
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      toast('二维码已复制到剪贴板');
    } catch (e) {
      console.error(e);
      toast('复制失败，请改用下载');
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!imgModal.hidden) closeImageModal(false);
  });

  /* =========================================================
     解码
     ========================================================= */
  const decResult = $('#decResult');
  const decStatus = $('#decStatus');
  const dropzone  = $('#dropzone');
  const fileInput = $('#fileInput');

  const decCanvas = document.createElement('canvas');
  const decCtx = decCanvas.getContext('2d', { willReadFrequently: true });

  function setStatus(msg, type) {
    decStatus.textContent = msg || '';
    decStatus.className = 'status' + (type ? ' ' + type : '');
  }

  function scanImage(img) {
    let w = img.naturalWidth || img.width;
    let h = img.naturalHeight || img.height;
    if (!w || !h) return null;

    const maxSide = Math.max(w, h);
    let scale = Math.min(1, 1400 / maxSide);
    if (maxSide < 500) scale = Math.min(3, 900 / maxSide);

    w = Math.max(1, Math.round(w * scale));
    h = Math.max(1, Math.round(h * scale));

    decCanvas.width = w;
    decCanvas.height = h;
    decCtx.clearRect(0, 0, w, h);
    decCtx.drawImage(img, 0, 0, w, h);

    const imageData = decCtx.getImageData(0, 0, w, h);
    let code = jsQR(imageData.data, w, h, { inversionAttempts: 'attemptBoth' });
    if (code) return code.data;

    const d = imageData.data;
    for (let i = 0; i < d.length; i += 4) {
      const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const v = gray < 128 ? 0 : 255;
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    code = jsQR(d, w, h, { inversionAttempts: 'attemptBoth' });
    return code ? code.data : null;
  }

  function handleFile(file) {
    if (!file) return;
    if (!file.type || file.type.indexOf('image/') !== 0) {
      setStatus('请选择图片文件', 'error');
      return;
    }
    if (typeof jsQR === 'undefined') {
      setStatus('解码库加载失败，请检查网络后刷新页面', 'error');
      return;
    }

    setStatus('识别中…');
    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = function () {
      URL.revokeObjectURL(url);
      let result = null;
      try { result = scanImage(img); } catch (e) { console.error(e); }
      if (result) {
        decResult.value = result;
        setStatus('识别成功 ✓', 'ok');
      } else {
        decResult.value = '';
        setStatus('未识别到二维码，试试更清晰、更大的图片', 'error');
      }
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      setStatus('图片加载失败', 'error');
    };
    img.src = url;
  }

  $('#btnPick').addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files[0]) handleFile(fileInput.files[0]);
    fileInput.value = '';
  });

  ['dragenter', 'dragover'].forEach(ev =>
    dropzone.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.add('over');
    })
  );
  ['dragleave', 'drop'].forEach(ev =>
    dropzone.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.remove('over');
    })
  );
  dropzone.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  ['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));

  document.addEventListener('paste', function (e) {
    const t = e.target;
    if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT')) return;

    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image') === 0) {
        const f = items[i].getAsFile();
        if (f) {
          e.preventDefault();
          activateTab('dec');
          handleFile(f);
        }
        return;
      }
    }
  });

  $('#btnCopyResult').addEventListener('click', async function () {
    const v = decResult.value;
    if (!v) { toast('没有可复制的内容'); return; }
    try {
      await navigator.clipboard.writeText(v);
      toast('已复制到剪贴板');
    } catch (e) {
      decResult.removeAttribute('readonly');
      decResult.select();
      document.execCommand('copy');
      decResult.setAttribute('readonly', 'readonly');
      toast('已复制');
    }
  });

  $('#btnOpenResult').addEventListener('click', function () {
    const v = decResult.value.trim();
    if (!v) { toast('没有识别结果'); return; }
    let url = null;
    if (/^https?:\/\//i.test(v)) url = v;
    else if (/^www\./i.test(v)) url = 'https://' + v;
    if (url) window.open(url, '_blank', 'noopener');
    else toast('识别内容不是网址');
  });

  /* =========================================================
     摄像头扫码
     ========================================================= */
  const camModal = $('#camModal');
  const camVideo = $('#camVideo');
  let camStream = null;
  let camRaf = null;

  async function openCamera() {
    if (typeof jsQR === 'undefined') { toast('解码库未加载'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast('当前环境不支持摄像头');
      return;
    }
    try {
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch (err) {
      toast('无法打开摄像头：' + (err.name || err.message));
      return;
    }

    camModal.hidden = false;
    camVideo.srcObject = camStream;
    try { await camVideo.play(); } catch (e) { /* 忽略 */ }
    camRaf = requestAnimationFrame(camTick);
  }

  function camTick() {
    if (camModal.hidden) return;

    if (camVideo.readyState === camVideo.HAVE_ENOUGH_DATA) {
      const w = camVideo.videoWidth;
      const h = camVideo.videoHeight;
      if (w && h) {
        decCanvas.width = w;
        decCanvas.height = h;
        decCtx.drawImage(camVideo, 0, 0, w, h);
        const data = decCtx.getImageData(0, 0, w, h);
        const code = jsQR(data.data, w, h, { inversionAttempts: 'dontInvert' });
        if (code) {
          decResult.value = code.data;
          setStatus('识别成功 ✓', 'ok');
          toast('扫码成功');
          closeCamera();
          return;
        }
      }
    }
    camRaf = requestAnimationFrame(camTick);
  }

  function closeCamera() {
    if (camRaf) { cancelAnimationFrame(camRaf); camRaf = null; }
    if (camStream) {
      camStream.getTracks().forEach(t => t.stop());
      camStream = null;
    }
    camVideo.srcObject = null;
    camModal.hidden = true;
  }

  $('#btnCamera').addEventListener('click', openCamera);
  $('#btnCamClose').addEventListener('click', closeCamera);
  camModal.addEventListener('click', e => { if (e.target === camModal) closeCamera(); });

  /* =========================================================
     初始化
     ========================================================= */
  sizeVal.textContent = sizeInput.value;
  updateCounter();
  renderQR();
})();
</script>
