<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随身WiFi调试助手</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-panel: #1a1d27;
    --bg-card: #222633;
    --bg-input: #2a2e3d;
    --border: #343a4d;
    --text: #e8eaf0;
    --text-dim: #8b91a5;
    --accent: #4f7cff;
    --accent-glow: rgba(79,124,255,.25);
    --success: #2ecc71;
    --error: #e74c3c;
    --warn: #f39c12;
    --radius: 10px;
    --font-mono: 'SF Mono','Cascadia Code','JetBrains Mono',Consolas,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── 顶栏 ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), #7c5cff);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
    box-shadow: 0 0 16px var(--accent-glow);
  }
  .topbar h1 { font-size: 15px; font-weight: 600; }
  .topbar h1 span { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 6px; }

  .status-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
    transition: all .3s;
  }
  .status-badge.connected {
    border-color: rgba(46,204,113,.4);
    color: var(--success);
    background: rgba(46,204,113,.08);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background .3s;
  }
  .status-badge.connected .status-dot {
    background: var(--success);
    box-shadow: 0 0 8px rgba(46,204,113,.6);
  }

  /* ── 主布局 ── */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 300px 1fr 280px;
    gap: 0;
    overflow: hidden;
    height: calc(100vh - 57px);
  }
  @media (max-width: 1100px) {
    .main { grid-template-columns: 1fr; height: auto; overflow: auto; }
    .panel { border-right: none !important; border-bottom: 1px solid var(--border); }
  }

  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-left { border-right: 1px solid var(--border); }
  .panel-right { border-left: 1px solid var(--border); }

  .panel-header {
    padding: 14px 16px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-body { flex: 1; overflow-y: auto; padding: 14px 16px; }

  /* ── 连接面板 ── */
  .conn-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 14px;
    background: var(--bg-card);
    border-radius: 8px;
    padding: 3px;
  }
  .conn-tab {
    flex: 1;
    padding: 7px 0;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    border-radius: 6px;
    cursor: pointer;
    transition: all .2s;
    border: none;
    background: none;
  }
  .conn-tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px var(--accent-glow);
  }
  .conn-tab:hover:not(.active) { color: var(--text); background: rgba(255,255,255,.04); }

  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 5px;
    font-weight: 500;
  }
  .form-control {
    width: 100%;
    padding: 8px 11px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: 13px;
    font-family: var(--font-mono);
    outline: none;
    transition: border-color .2s;
  }
  .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  select.form-control { cursor: pointer; }

  .btn {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 10px var(--accent-glow);
  }
  .btn-primary:hover:not(:disabled) { background: #6b92ff; transform: translateY(-1px); }
  .btn-danger {
    background: rgba(231,76,60,.15);
    color: var(--error);
    border: 1px solid rgba(231,76,60,.3);
  }
  .btn-danger:hover:not(:disabled) { background: rgba(231,76,60,.25); }
  .btn-sm { padding: 6px 10px; font-size: 11px; width: auto; }
  .btn-outline {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-outline:hover:not(:disabled) { color: var(--text); border-color: var(--text-dim); }

  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row .btn { flex: 1; }

  /* ── 终端 ── */
  .terminal-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #0a0c12;
  }
  .terminal {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.7;
    color: #c8cdd8;
  }
  .terminal .line { display: flex; gap: 8px; }
  .terminal .prefix { flex-shrink: 0; user-select: none; }
  .terminal .prefix.cmd { color: var(--accent); }
  .terminal .prefix.resp { color: var(--success); }
  .terminal .prefix.err  { color: var(--error); }
  .terminal .prefix.info { color: var(--warn); }
  .terminal .content { word-break: break-all; white-space: pre-wrap; }
  .terminal .content.err { color: #ff8a80; }

  .terminal-input-row {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--border);
    background: var(--bg-panel);
    padding: 8px 12px;
    align-items: center;
  }
  .terminal-input-row .prompt {
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    margin-right: 8px;
    flex-shrink: 0;
  }
  .terminal-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 4px 0;
  }
  .terminal-input::placeholder { color: #4a5060; }
  .terminal-send {
    padding: 5px 14px;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 8px;
    transition: background .2s;
  }
  .terminal-send:hover { background: #6b92ff; }

  /* ── 快捷操作 ── */
  .quick-section { margin-bottom: 16px; }
  .quick-section h4 {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .6px;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .quick-btn {
    padding: 8px 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: 11.5px;
    cursor: pointer;
    transition: all .2s;
    text-align: center;
    font-family: inherit;
    line-height: 1.4;
  }
  .quick-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(79,124,255,.06); }
  .quick-btn:disabled { opacity: .35; cursor: not-allowed; }
  .quick-btn .cmd-hint {
    display: block;
    font-size: 9.5px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    margin-top: 2px;
  }

  /* ── 信息卡 ── */
  .info-item {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,.04);
    font-size: 12px;
  }
  .info-item:last-child { border-bottom: none; }
  .info-label { color: var(--text-dim); flex-shrink: 0; margin-right: 8px; }
  .info-value {
    font-family: var(--font-mono);
    font-size: 11.5px;
    text-align: right;
    word-break: break-all;
    color: var(--text);
  }
  .info-value.ok { color: var(--success); }
  .info-value.empty { color: #4a5060; }

  /* ── 滚动条 ── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2e3342; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #3e455a; }

  /* ── Toast ── */
  .toast-container {
    position: fixed;
    top: 70px; right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 500;
    color: #fff;
    background: var(--bg-card);
    border: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
    animation: slideIn .3s ease;
    pointer-events: auto;
    max-width: 300px;
  }
  .toast.success { border-color: rgba(46,204,113,.4); background: rgba(46,204,113,.12); color: var(--success); }
  .toast.error   { border-color: rgba(231,76,60,.4);  background: rgba(231,76,60,.12);  color: var(--error); }
  .toast.info    { border-color: rgba(79,124,255,.4);  background: rgba(79,124,255,.12);  color: #7fa4ff; }
  @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ── 弹窗 ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(4px);
    z-index: 9998;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    width: 380px;
    max-width: 92vw;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal h3 { font-size: 15px; margin-bottom: 14px; }
  .modal .form-group { margin-bottom: 10px; }
  .modal .btn-row { margin-top: 16px; }

  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-dim);
    font-size: 12.5px;
    line-height: 1.8;
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 10px; opacity: .4; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ══════════ 顶栏 ══════════ -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">W</div>
    <h1>随身WiFi调试助手 <span>AT Master</span></h1>
  </div>
  <div class="status-badge" id="statusBadge">
    <div class="status-dot"></div>
    <span id="statusText">未连接</span>
  </div>
</div>

<!-- ══════════ 主区域 ══════════ -->
<div class="main">

  <!-- ── 左侧：连接面板 ── -->
  <div class="panel panel-left">
    <div class="panel-header">连接设置</div>
    <div class="panel-body">
      <div class="conn-tabs">
        <button class="conn-tab active" data-mode="usb" onclick="switchMode('usb')">USB 串口</button>
        <button class="conn-tab" data-mode="wifi" onclick="switchMode('wifi')">WiFi 网络</button>
      </div>

      <!-- USB 模式 -->
      <div id="panelUSB">
        <div class="form-group">
          <label>波特率 Baud Rate</label>
          <select class="form-control" id="baudRate">
            <option value="115200" selected>115200</option>
            <option value="9600">9600</option>
            <option value="57600">57600</option>
            <option value="38400">38400</option>
            <option value="19200">19200</option>
            <option value="4800">4800</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnConnectUSB" onclick="connectUSB()">
          🔌 选择串口并连接
        </button>
        <div class="btn-row">
          <button class="btn btn-danger" id="btnDisconnectUSB" onclick="disconnect()" disabled>断开连接</button>
        </div>
        <div style="margin-top:10px;font-size:11px;color:var(--text-dim);line-height:1.6;">
          需要 Chrome 89+ / Edge 89+ 浏览器。<br>
          Web Serial API 仅在 HTTPS 或 localhost 下可用。
        </div>
      </div>

      <!-- WiFi 模式 -->
      <div id="panelWiFi" class="hidden">
        <div class="form-group">
          <label>设备网关地址</label>
          <input class="form-control" id="wifiGateway" value="192.168.0.1" placeholder="192.168.0.1">
        </div>
        <div class="form-group">
          <label>管理端口</label>
          <input class="form-control" id="wifiPort" value="80" placeholder="80">
        </div>
        <div class="form-group">
          <label>协议</label>
          <select class="form-control" id="wifiProtocol">
            <option value="http" selected>HTTP</option>
            <option value="https">HTTPS</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnConnectWiFi" onclick="connectWiFi()">
          📶 检测设备可达性
        </button>
        <div style="margin-top:10px;font-size:11px;color:var(--text-dim);line-height:1.6;">
          浏览器安全策略限制，无法直接通过 WiFi 发送 AT 指令。<br>
          此模式用于检测设备网关是否可达、获取设备基本信息。
        </div>
      </div>
    </div>
  </div>

  <!-- ── 中间：终端 ── -->
  <div class="panel panel-center">
    <div class="panel-header">
      <span>AT 指令终端</span>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-outline btn-sm" onclick="clearTerminal()">清屏</button>
        <button class="btn btn-outline btn-sm" onclick="exportLog()">导出日志</button>
      </div>
    </div>
    <div class="terminal-wrap">
      <div class="terminal" id="terminal">
        <div class="line">
          <span class="prefix info">●</span>
          <span class="content" style="color:var(--text-dim);">随身WiFi调试助手已就绪。请先连接设备，然后在下方输入 AT 指令。</span>
        </div>
      </div>
      <div class="terminal-input-row">
        <span class="prompt">AT&gt;</span>
        <input class="terminal-input" id="atInput" placeholder="输入 AT 指令，如 AT+CGSN" 
               onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAT();}">
        <button class="terminal-send" onclick="sendAT()">发送</button>
      </div>
    </div>
  </div>

  <!-- ── 右侧：快捷操作 + 设备信息 ── -->
  <div class="panel panel-right">
    <div class="panel-header">快捷工具</div>
    <div class="panel-body">

      <!-- 设备信息 -->
      <div class="quick-section">
        <h4>设备信息</h4>
        <div id="deviceInfo">
          <div class="info-item"><span class="info-label">IMEI</span><span class="info-value empty" id="infoIMEI">—</span></div>
          <div class="info-item"><span class="info-label">SN</span><span class="info-value empty" id="infoSN">—</span></div>
          <div class="info-item"><span class="info-label">WiFi MAC</span><span class="info-value empty" id="infoMAC">—</span></div>
          <div class="info-item"><span class="info-label">固件版本</span><span class="info-value empty" id="infoVER">—</span></div>
        </div>
      </div>

      <!-- 信息查询 -->
      <div class="quick-section">
        <h4>信息查询</h4>
        <div class="quick-grid">
          <button class="quick-btn" onclick="quickCmd('AT+CGSN')" disabled>IMEI 查询<span class="cmd-hint">AT+CGSN</span></button>
          <button class="quick-btn" onclick="quickCmd('AT*MRD_SN?')" disabled>SN 查询<span class="cmd-hint">AT*MRD_SN?</span></button>
          <button class="quick-btn" onclick="quickCmd('AT*MRD_WIFIID?')" disabled>MAC 查询<span class="cmd-hint">AT*MRD_WIFIID?</span></button>
          <button class="quick-btn" onclick="quickCmd('AT+VER')" disabled>版本查询<span class="cmd-hint">AT+VER</span></button>
          <button class="quick-btn" onclick="quickCmd('AT*BAND?')" disabled>频段查询<span class="cmd-hint">AT*BAND?</span></button>
          <button class="quick-btn" onclick="quickCmd('AT+CSQ')" disabled>信号质量<span class="cmd-hint">AT+CSQ</span></button>
        </div>
      </div>

      <!-- 操作 -->
      <div class="quick-section">
        <h4>常用操作</h4>
        <div class="quick-grid">
          <button class="quick-btn" onclick="quickCmd('AT+RESET')" disabled>重启设备<span class="cmd-hint">AT+RESET</span></button>
          <button class="quick-btn" onclick="quickCmd('AT*PROD=1')" disabled>进入工厂<span class="cmd-hint">AT*PROD=1</span></button>
          <button class="quick-btn" onclick="quickCmd('AT*PROD=0')" disabled>退出工厂<span class="cmd-hint">AT*PROD=0</span></button>
          <button class="quick-btn" onclick="quickCmd('AT+SWSIM=0')" disabled>SIM 卡1<span class="cmd-hint">AT+SWSIM=0</span></button>
          <button class="quick-btn" onclick="quickCmd('AT+SWSIM=1')" disabled>SIM 卡2<span class="cmd-hint">AT+SWSIM=1</span></button>
        </div>
      </div>

      <!-- 写入操作 -->
      <div class="quick-section">
        <h4>写入操作</h4>
        <div class="quick-grid">
          <button class="quick-btn" onclick="openWriteModal('imei')" disabled>写入 IMEI</button>
          <button class="quick-btn" onclick="openWriteModal('sn')" disabled>写入 SN</button>
          <button class="quick-btn" onclick="openWriteModal('mac')" disabled>写入 MAC</button>
          <button class="quick-btn" style="grid-column:1/-1;color:var(--error);border-color:rgba(231,76,60,.3);"
                  onclick="confirmDanger('删除SN', 'AT*MRD_SN=D')" disabled>删除 SN</button>
        </div>
      </div>

      <!-- 锁频段 -->
      <div class="quick-section">
        <h4>频段锁定</h4>
        <div class="quick-grid" id="bandGrid">
          <!-- JS 动态生成 -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══════════ 写入弹窗 ══════════ -->
<div class="modal-overlay" id="writeModal">
  <div class="modal">
    <h3 id="writeModalTitle">写入值</h3>
    <div class="form-group">
      <label id="writeModalLabel">请输入新值</label>
      <input class="form-control" id="writeModalInput" placeholder="">
    </div>
    <div style="font-size:11px;color:var(--text-dim);margin-top:6px;" id="writeModalHint"></div>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="writeModalConfirm" onclick="confirmWrite()">确认写入</button>
    </div>
  </div>
</div>

<!-- ══════════ 确认弹窗 ══════════ -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <h3 id="confirmModalTitle">确认操作</h3>
    <p style="color:var(--text-dim);font-size:13px;line-height:1.6;" id="confirmModalDesc"></p>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="closeConfirmModal()">取消</button>
      <button class="btn btn-danger" id="confirmModalBtn">确认执行</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* ═══════════════════════════════════════════════════
   全局状态
   ═══════════════════════════════════════════════════ */
const state = {
  mode: 'usb',
  connected: false,
  port: null,
  reader: null,
  writer: null,
  readLoopActive: false,
  logBuffer: [],
  isWriting: false,
};

const BAND_MAP = {
  B1:  { label: 'B1',  param: ',0,1,0,2,2,0'   },
  B3:  { label: 'B3',  param: ',0,4,0,2,2,0'   },
  B5:  { label: 'B5',  param: ',0,16,0,2,2,0'  },
  B8:  { label: 'B8',  param: ',0,128,0,2,2,0' },
  B38: { label: 'B38', param: ',32,0,0,2,2,0'  },
  B39: { label: 'B39', param: ',64,0,0,2,2,0'  },
  B40: { label: 'B40', param: ',128,0,0,2,2,0' },
  B41: { label: 'B41', param: ',256,0,0,2,2,0' },
};

/* ═══════════════════════════════════════════════════
   Toast 通知
   ═══════════════════════════════════════════════════ */
function toast(msg, type = 'info', duration = 3000) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity .3s';
    setTimeout(() => el.remove(), 300);
  }, duration);
}

/* ═══════════════════════════════════════════════════
   终端输出
   ═══════════════════════════════════════════════════ */
function termWrite(text, type = 'resp') {
  const terminal = document.getElementById('terminal');
  const line = document.createElement('div');
  line.className = 'line';

  const prefixMap = { cmd: '→', resp: '←', err: '✕', info: '●' };
  const prefix = document.createElement('span');
  prefix.className = `prefix ${type}`;
  prefix.textContent = prefixMap[type] || '●';

  const content = document.createElement('span');
  content.className = `content${type === 'err' ? ' err' : ''}`;
  content.textContent = text;

  line.appendChild(prefix);
  line.appendChild(content);
  terminal.appendChild(line);
  terminal.scrollTop = terminal.scrollHeight;

  state.logBuffer.push(`[${type.toUpperCase()}] ${text}`);
}

function clearTerminal() {
  document.getElementById('terminal').innerHTML = '';
  state.logBuffer = [];
  termWrite('终端已清空。', 'info');
}

function exportLog() {
  if (state.logBuffer.length === 0) { toast('暂无日志', 'info'); return; }
  const blob = new Blob([state.logBuffer.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `atmaster-log-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  toast('日志已导出', 'success');
}

/* ═══════════════════════════════════════════════════
   模式切换
   ═══════════════════════════════════════════════════ */
function switchMode(mode) {
  if (state.connected) { toast('请先断开当前连接', 'error'); return; }
  state.mode = mode;
  document.querySelectorAll('.conn-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.getElementById('panelUSB').classList.toggle('hidden', mode !== 'usb');
  document.getElementById('panelWiFi').classList.toggle('hidden', mode !== 'wifi');
}

/* ═══════════════════════════════════════════════════
   USB 连接 (Web Serial API)
   ═══════════════════════════════════════════════════ */
async function connectUSB() {
  if (!('serial' in navigator)) {
    toast('当前浏览器不支持 Web Serial API，请使用 Chrome 89+ / Edge 89+', 'error', 5000);
    return;
  }
  try {
    const baud = parseInt(document.getElementById('baudRate').value);
    termWrite(`正在请求串口... (波特率 ${baud})`, 'info');

    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: baud, dataBits: 8, stopBits: 1, parity: 'none' });

    state.port = port;
    state.connected = true;
    state.isWriting = false;

    updateConnectionUI(true, `串口已连接 @ ${baud}`);
    termWrite(`串口已打开，波特率 ${baud}`, 'info');
    toast(`USB 串口连接成功 @ ${baud}`, 'success');
    enableQuickButtons(true);

    // 启动读取循环
    startReadLoop();

    // 自动查询设备信息
    setTimeout(() => autoQueryDeviceInfo(), 500);

  } catch (err) {
    if (err.name === 'NotFoundError') {
      termWrite('用户取消了串口选择。', 'err');
    } else {
      termWrite(`连接失败: ${err.message}`, 'err');
      toast(`连接失败: ${err.message}`, 'error', 5000);
    }
    console.error(err);
  }
}

async function startReadLoop() {
  if (!state.port || !state.port.readable) return;
  state.readLoopActive = true;

  while (state.port.readable && state.readLoopActive) {
    state.reader = state.port.readable.getReader();
    let decoder = new TextDecoder();
    let buffer = '';

    try {
      while (true) {
        const { value, done } = await state.reader.read();
        if (done) break;
        if (value) {
          buffer += decoder.decode(value, { stream: true });
          // 按行分割输出
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() || '';
          for (const line of lines) {
            if (line.trim()) {
              termWrite(line.trim(), 'resp');
              parseDeviceInfo(line.trim());
            }
          }
        }
      }
    } catch (err) {
      if (err.name !== 'NetworkError' && state.connected) {
        termWrite(`读取错误: ${err.message}`, 'err');
      }
    } finally {
      state.reader.releaseLock();
    }
  }
}

async function writeToPort(data) {
  if (!state.port || !state.port.writable) throw new Error('串口不可写');
  const encoder = new TextEncoder();
  const writer = state.port.writable.getWriter();
  try {
    await writer.write(encoder.encode(data + '\r\n'));
  } finally {
    writer.releaseLock();
  }
}

async function disconnect() {
  state.readLoopActive = false;
  state.connected = false;

  try {
    if (state.reader) {
      await state.reader.cancel().catch(() => {});
      state.reader = null;
    }
    if (state.port) {
      await state.port.close();
      state.port = null;
    }
  } catch (err) {
    console.error('断开时出错:', err);
  }

  updateConnectionUI(false, '未连接');
  termWrite('串口已断开。', 'info');
  toast('已断开连接', 'info');
  enableQuickButtons(false);
  resetDeviceInfo();
}

/* ═══════════════════════════════════════════════════
   WiFi 连接（可达性检测）
   ═══════════════════════════════════════════════════ */
async function connectWiFi() {
  const protocol = document.getElementById('wifiProtocol').value;
  const gateway = document.getElementById('wifiGateway').value.trim();
  const port = document.getElementById('wifiPort').value.trim();
  const url = `${protocol}://${gateway}${port && port !== '80' && port !== '443' ? ':' + port : ''}`;

  termWrite(`正在检测设备可达性: ${url}`, 'info');
  toast('正在检测设备...', 'info');

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);

    // 使用 no-cors 模式检测可达性（不读取响应内容）
    await fetch(url, {
      mode: 'no-cors',
      signal: controller.signal,
      cache: 'no-store',
    });
    clearTimeout(timeout);

    termWrite(`设备网关 ${gateway} 可达 ✓`, 'resp');
    termWrite(`浏览器安全策略限制，无法通过 WiFi 发送 AT 指令。`, 'info');
    termWrite(`如需 AT 调试，请使用 USB 串口连接。`, 'info');
    toast('设备网关可达，但 WiFi 模式不支持 AT 指令发送', 'info', 5000);

    document.getElementById('infoIMEI').textContent = '需USB连接';
    document.getElementById('infoSN').textContent = '需USB连接';
    document.getElementById('infoMAC').textContent = '需USB连接';

  } catch (err) {
    if (err.name === 'AbortError') {
      termWrite(`连接超时：设备 ${gateway} 无响应`, 'err');
      toast('连接超时，请检查网关地址', 'error');
    } else {
      termWrite(`检测失败: ${err.message}`, 'err');
      toast(`检测失败: ${err.message}`, 'error');
    }
  }
}

/* ═══════════════════════════════════════════════════
   AT 指令发送
   ═══════════════════════════════════════════════════ */
async function sendAT() {
  const input = document.getElementById('atInput');
  const cmd = input.value.trim();
  if (!cmd) return;
  input.value = '';

  if (state.mode !== 'usb' || !state.connected) {
    termWrite('未连接设备，请先通过 USB 连接串口。', 'err');
    toast('请先连接 USB 串口', 'error');
    return;
  }

  termWrite(cmd, 'cmd');

  try {
    await writeToPort(cmd);
  } catch (err) {
    termWrite(`发送失败: ${err.message}`, 'err');
    toast('发送失败，连接可能已断开', 'error');
    if (err.message.includes('不可写') || err.name === 'NetworkError') {
      disconnect();
    }
  }
}

function quickCmd(cmd) {
  document.getElementById('atInput').value = cmd;
  sendAT();
}

/* ═══════════════════════════════════════════════════
   设备信息解析
   ═══════════════════════════════════════════════════ */
function parseDeviceInfo(line) {
  // IMEI
  if (/^\d{15}$/.test(line)) {
    document.getElementById('infoIMEI').textContent = line;
    document.getElementById('infoIMEI').className = 'info-value ok';
  }
  // SN (通常以字母数字组合，长度较长)
  if (/^[A-Z0-9]{8,20}$/.test(line) && !/^\d{15}$/.test(line)) {
    const snEl = document.getElementById('infoSN');
    if (snEl.textContent === '—') {
      snEl.textContent = line;
      snEl.className = 'info-value ok';
    }
  }
  // MAC 地址
  const macMatch = line.match(/([0-9A-Fa-f]{2}[:\-]){5}[0-9A-Fa-f]{2}/);
  if (macMatch) {
    document.getElementById('infoMAC').textContent = macMatch[0];
    document.getElementById('infoMAC').className = 'info-value ok';
  }
  // 版本号
  const verMatch = line.match(/^(?:Revision|VER|version)[:\s]*(.+)/i);
  if (verMatch) {
    document.getElementById('infoVER').textContent = verMatch[1].trim();
    document.getElementById('infoVER').className = 'info-value ok';
  }
}

async function autoQueryDeviceInfo() {
  const cmds = ['AT+CGSN', 'AT*MRD_SN?', 'AT*MRD_WIFIID?', 'AT+VER'];
  for (const c of cmds) {
    termWrite(c, 'cmd');
    try { await writeToPort(c); } catch (e) { break; }
    await sleep(400);
  }
}

function resetDeviceInfo() {
  ['infoIMEI','infoSN','infoMAC','infoVER'].forEach(id => {
    const el = document.getElementById(id);
    el.textContent = '—';
    el.className = 'info-value empty';
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ═══════════════════════════════════════════════════
   UI 状态更新
   ═══════════════════════════════════════════════════ */
function updateConnectionUI(connected, text) {
  state.connected = connected;
  const badge = document.getElementById('statusBadge');
  badge.classList.toggle('connected', connected);
  document.getElementById('statusText').textContent = text;

  document.getElementById('btnConnectUSB').disabled = connected;
  document.getElementById('btnDisconnectUSB').disabled = !connected;
  document.getElementById('baudRate').disabled = connected;
}

function enableQuickButtons(enable) {
  document.querySelectorAll('.quick-btn').forEach(btn => {
    btn.disabled = !enable;
  });
  updateBandButtons();
}

/* ═══════════════════════════════════════════════════
   写入弹窗
   ═══════════════════════════════════════════════════ */
let writeTarget = null;

function openWriteModal(type) {
  writeTarget = type;
  const titles = { imei: '写入 IMEI', sn: '写入 SN', mac: '写入 MAC' };
  const labels = { imei: '15 位 IMEI（含 Luhn 校验位）', sn: '序列号', mac: 'MAC 地址（如 AA:BB:CC:DD:EE:FF）' };
  const placeholders = { imei: '例如 864512345678901', sn: '例如 SN12345678', mac: '例如 A4:5E:60:12:34:56' };
  const hints = {
    imei: '写入指令: AT*MRD_IMEI=W,0,01JAN1970,<imei>',
    sn:   '写入指令: AT*MRD_SN=W,0,01JAN1970,<sn>',
    mac:  '写入指令: AT*MRD_WIFIID=W,0,01JAN1970,<mac>',
  };

  document.getElementById('writeModalTitle').textContent = titles[type];
  document.getElementById('writeModalLabel').textContent = labels[type];
  document.getElementById('writeModalInput').placeholder = placeholders[type];
  document.getElementById('writeModalInput').value = '';
  document.getElementById('writeModalHint').textContent = hints[type];
  document.getElementById('writeModal').classList.add('show');
}

function closeModal() {
  document.getElementById('writeModal').classList.remove('show');
  writeTarget = null;
}

function confirmWrite() {
  const val = document.getElementById('writeModalInput').value.trim();
  if (!val) { toast('请输入值', 'error'); return; }

  let cmd = '';
  if (writeTarget === 'imei') {
    cmd = `AT*MRD_IMEI=W,0,01JAN1970,${val}`;
  } else if (writeTarget === 'sn') {
    cmd = `AT*MRD_SN=W,0,01JAN1970,${val}`;
  } else if (writeTarget === 'mac') {
    const macClean = val.replace(/[:\-]/g, '');
    cmd = `AT*MRD_WIFIID=W,0,01JAN1970,${macClean}`;
  }

  closeModal();
  quickCmd(cmd);
}

/* ═══════════════════════════════════════════════════
   确认弹窗（危险操作）
   ═══════════════════════════════════════════════════ */
let pendingDangerCmd = null;

function confirmDanger(title, cmd) {
  pendingDangerCmd = cmd;
  document.getElementById('confirmModalTitle').textContent = title;
  document.getElementById('confirmModalDesc').textContent = `即将执行: ${cmd}\n\n此操作不可撤销，请确认设备已进入工厂模式。`;
  document.getElementById('confirmModal').classList.add('show');
}

function closeConfirmModal() {
  document.getElementById('confirmModal').classList.remove('show');
  pendingDangerCmd = null;
}

document.getElementById('confirmModalBtn').addEventListener('click', () => {
  if (pendingDangerCmd) {
    quickCmd(pendingDangerCmd);
    closeConfirmModal();
  }
});

/* ═══════════════════════════════════════════════════
   频段锁定
   ═══════════════════════════════════════════════════ */
function buildBandGrid() {
  const grid = document.getElementById('bandGrid');
  grid.innerHTML = '';
  Object.entries(BAND_MAP).forEach(([key, info]) => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.disabled = !state.connected;
    btn.innerHTML = `${info.label}<span class="cmd-hint">锁频</span>`;
    btn.onclick = () => {
      const cmd = `AT*BAND=${info.param}`;
      quickCmd(cmd);
    };
    grid.appendChild(btn);
  });

  // 解除锁频按钮
  const clearBtn = document.createElement('button');
  clearBtn.className = 'quick-btn';
  clearBtn.style.gridColumn = '1 / -1';
  clearBtn.style.color = 'var(--warn)';
  clearBtn.disabled = !state.connected;
  clearBtn.innerHTML = `解除锁频<span class="cmd-hint">AT*BAND=0</span>`;
  clearBtn.onclick = () => quickCmd('AT*BAND=0');
  grid.appendChild(clearBtn);
}

function updateBandButtons() {
  document.querySelectorAll('#bandGrid .quick-btn').forEach(btn => {
    btn.disabled = !state.connected;
  });
}

/* ═══════════════════════════════════════════════════
   初始化
   ═══════════════════════════════════════════════════ */
buildBandGrid();

// 检测 Web Serial API 支持
if (!('serial' in navigator)) {
  document.getElementById('btnConnectUSB').disabled = true;
  document.getElementById('btnConnectUSB').textContent = '⚠ 浏览器不支持 Web Serial';
  termWrite('当前浏览器不支持 Web Serial API。请使用 Chrome 89+ 或 Edge 89+ 浏览器。', 'err');
}

// 关闭弹窗（点击遮罩）
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) {
      overlay.classList.remove('show');
      pendingDangerCmd = null;
    }
  });
});

// 快捷键
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('show'));
    pendingDangerCmd = null;
  }
});

console.log('随身WiFi调试助手已加载 | Web Serial API:', 'serial' in navigator);
</script>
